# Automated projections: FantasyPros consensus raw stats + our model (50/50 blend) -> projections.json.
# Runs on GitHub's servers: no Claude usage, no laptop. Times are UTC (Eastern Standard Time + 5 h).
name: Projections
on:
  schedule:
    # v1.11.0 (Wes, Nov 13): more runs around injury news and inactive lists. Odd minutes: GitHub delays :00 runs the most.
    - cron: "0 13 * * *"      # every day 8:00 AM ET
    - cron: "47 21 * * 3,4,5" # Wed-Fri 4:47 PM ET (after the daily injury reports; Friday = final game statuses)
    - cron: "17 15 * * 6"     # Saturday 10:17 AM ET
    - cron: "17 19 * * 6"     # Saturday 2:17 PM ET
    - cron: "17 0 * * 0"      # Saturday 7:17 PM ET (Sunday 00:17 UTC)
    - cron: "0 16 * * 0"      # Sunday 11:00 AM ET (after most injury news, before 1 PM kickoffs)
    - cron: "47 16 * * 0"     # Sunday 11:47 AM ET (1 PM inactives come ~11:30)
    - cron: "30 17 * * 0"     # Sunday 12:30 PM ET (1 PM inactives are out)
    - cron: "7 20 * * 0"      # Sunday 3:07 PM ET (4:05 / 4:25 PM inactives come ~2:35-2:55)
    - cron: "7 0 * * 1,2,5"   # Sun / Mon / Thu 7:07 PM ET (Mon/Tue/Fri 00:07 UTC; night-game inactives come ~6:45-6:50)
  push:
    branches: [main]
    paths: [model/fgt_model.py, model/fetch_fp.py, model/fetch_sources.py, model/run_projections.py, model/grade.py, .github/workflows/projections.yml, run-now.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: projections
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: pip install -r model/requirements.txt
      # last good FantasyPros pull per week (private to Actions; reused if FantasyPros is briefly unreachable)
      - uses: actions/cache/restore@v4
        with:
          path: fp-cache
          key: fp-${{ github.run_id }}
          restore-keys: fp-
      - name: Run model
        id: run
        env:
          FP_API_KEY: ${{ secrets.FP_API_KEY }}   # FantasyPros personal API key (GitHub secret; never printed)
        run: python model/run_projections.py
      - name: Grade past weeks (projection scorecard)
        if: always()
        continue-on-error: true
        run: python model/grade.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: fp-cache
          key: fp-${{ github.run_id }}
      - name: Save projections
        if: always()
        run: |
          git config user.name "fgt-bot"
          git config user.email "fgt-bot@users.noreply.github.com"
          git add projections.json projections-status.json history
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          WK=$(python -c "import json;s=json.load(open('projections-status.json'));print(s.get('week','?'), 'FP-blended' if s.get('fp_blended') else 'unblended', 'OK' if s.get('ok') else 'FAILED')")
          git commit -m "projections: week $WK"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
