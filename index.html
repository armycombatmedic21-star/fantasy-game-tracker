<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>html,body{background:#060b16}</style>
<meta name="theme-color" content="#060b16">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link id="manifestLink" rel="manifest">
<link id="touchIcon" rel="apple-touch-icon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Tracker">
<meta name="mobile-web-app-capable" content="yes">
<title>Game Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"></noscript>
<style>
/* ===================== Fantasy Game Tracker =====================
   One file. Look = approved round 5 mock-up (Pick'em "premium glass", blue accent).
   Sections: tokens/base · header/status · scoreboard cards · matchup · standings ·
   sheets/overlays (Pick'em) · first-open gate (Pick'em) · tab bar (Pick'em Glass Pill) · motion */
:root{
  --bg:#060b16; --card:linear-gradient(180deg,#0e1829,#0b1321);
  --hair:rgba(147,174,200,.10); --hair2:rgba(147,174,200,.22);
  --acc:#4f8dff; --acc-rgb:79,141,255; --ink:#050f24;
  --gold:#f4c43d; --green:#3ddc84; --red:#ff3b4e; --amber:#ffb020;
  --text:#dce8f5; --muted:#93aec8; --faint:#6a84a0;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:contain}
body{background:var(--bg);background-image:linear-gradient(180deg,#0a1426 0,#060b16 260px);background-repeat:no-repeat;color:var(--text);font-family:var(--font);font-variant-numeric:tabular-nums;margin:0;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,.mc:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
img{display:block}

/* ---- header ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.kick{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--acc)}
h1{margin:3px 0 0;font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
.hbtns{display:flex;gap:8px}
.pill{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.04);font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.now{border-color:rgba(var(--acc-rgb),.7);color:var(--acc);box-shadow:0 0 14px rgba(var(--acc-rgb),.18)}
.gear{width:42px;height:42px;border-radius:50%;border:1px solid var(--hair2);background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.35}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:beacon 2s infinite;flex:none}
.dot.still{animation:none;background:var(--faint)}
.dot.bad{animation:none;background:var(--amber)}
@keyframes beacon{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.55)}70%{box-shadow:0 0 0 9px rgba(var(--acc-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),0)}}
.status b{color:var(--text);font-weight:800}
.status b.warn{color:var(--amber)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h2{margin:0;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.sec span{font-size:12px;color:var(--faint);font-weight:600;text-align:right}
.linkbtn{font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;margin:-6px 0}

.pick{width:100%;border-radius:18px;padding:20px;text-align:left;border:1.5px solid rgba(var(--acc-rgb),.75);background:linear-gradient(180deg,rgba(var(--acc-rgb),.10),rgba(var(--acc-rgb),.02));display:flex;align-items:center;gap:16px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 22px rgba(var(--acc-rgb),.35)}}
.pick .ic{width:50px;height:50px;border-radius:14px;background:var(--acc);color:var(--ink);display:grid;place-items:center;flex:none}
.pick strong{display:block;font-size:18px;font-weight:800;color:#fff}
.pick small{font-size:14px;color:var(--muted);font-weight:600}

/* ---- scoreboard cards ---- */
.mc{position:relative;border:1px solid var(--hair);background:var(--card);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 24px rgba(0,0,0,.42);padding:12px 16px 14px;margin-bottom:12px;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.mc.mine{border-color:rgba(var(--acc-rgb),.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(var(--acc-rgb),.12),0 10px 24px rgba(0,0,0,.42)}
.mchead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:26px}
.tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.mine .tag{color:var(--acc)}
.pin{width:34px;height:34px;margin:-6px 0 -6px -8px;display:grid;place-items:center;border-radius:9px;color:var(--faint);position:relative}
.pin::before{content:"";position:absolute;inset:-6px}
.pin[aria-pressed="true"]{color:var(--acc)}
.trow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;padding:6px 0}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--hair2);color:var(--text);overflow:hidden;flex:none}
.badge img{width:100%;height:100%;object-fit:cover}
.tn{min-width:0}
.tn b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn small{font-size:13px;color:var(--faint);font-weight:600}
.sc{text-align:right}
.sc b{display:block;font-size:25px;font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1.05}
.sc small{font-size:12px;color:var(--faint);font-weight:700}
.trow.lead .sc b{color:var(--green)}
.engine{text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin-top:6px}
.mc .engine{margin-top:8px;padding-top:9px;border-top:1px solid var(--hair)}

.mc.lg{padding:10px 14px 11px;margin-bottom:9px;border-radius:15px}
.mc.lg .mchead{position:absolute;top:7px;left:7px;margin:0;min-height:0;z-index:2}
.mc.lg .pin{margin:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);background:rgba(255,255,255,.04)}
.mc.lg .pin[aria-pressed="true"]{border-color:var(--acc);background:rgba(var(--acc-rgb),.18);box-shadow:0 0 10px rgba(var(--acc-rgb),.35)}
.mc.lg .rows{padding-left:0;padding-top:16px}
.mc.lg .trow{grid-template-columns:30px 1fr auto;gap:10px;padding:3px 0}
.mc.lg .badge{width:30px;height:30px;border-radius:8px;font-size:11px}
.mc.lg .tn b{font-size:17px;display:inline}
.mc.lg .tn small{font-size:13px;margin-left:6px}
.mc.lg .sc{display:flex;align-items:baseline;gap:8px}
.mc.lg .sc b{font-size:22px;order:2}
.mc.lg .sc small{font-size:12px;order:1}
.mc.lg .left{position:absolute;top:9px;right:14px;font-size:10px}

/* ---- matchup screen ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back{height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--hair2);color:var(--acc);font-weight:800;font-size:14px}
.mtitle{font-size:14px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#fff}
.hero{border:1px solid var(--hair);background:var(--card);border-radius:20px;padding:16px 14px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.hgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.hteam{display:flex;flex-direction:column;gap:6px;min-width:0}
.hteam.r{align-items:flex-end;text-align:right}
.hteam .badge{width:48px;height:48px;border-radius:15px;font-size:14px}
.hteam b{font-size:17px;font-weight:800;line-height:1.15}
.hteam small{font-size:13px;color:var(--faint);font-weight:600}
.hsc{display:grid;grid-template-columns:auto auto;gap:2px 18px;text-align:center}
.hsc b{font-size:34px;font-weight:800;letter-spacing:-1px;color:#fff;line-height:1.05}
.hsc b.lead{color:var(--green)}
.hsc em{grid-column:1/-1;font-style:normal;font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase;margin-top:4px}
.swipehint{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dots{display:flex;justify-content:center;gap:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots i.on{background:var(--acc)}
.arrow{width:44px;height:38px;border-radius:10px;color:var(--muted);font-size:22px;font-weight:800;display:grid;place-items:center}

.plist{margin-top:14px;border:1px solid var(--hair);background:#0b1321;border-radius:18px;overflow:hidden}
.plabel{padding:12px 14px 8px;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.prow{display:grid;grid-template-columns:1fr 52px 1fr;align-items:start;gap:6px;padding:12px;border-top:1px solid rgba(147,174,200,.08);width:100%;text-align:left}
.pside{min-width:0;display:flex;flex-direction:column;gap:3px}
.pside.r{align-items:flex-end;text-align:right}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.pside.r .ptop{flex-direction:row-reverse}
.nfl{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--hair);overflow:hidden}
.nfl img{width:24px;height:24px;object-fit:contain}
.ppt{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.pside.r .ppt{align-items:flex-start}
.ppt b{font-size:22px;font-weight:800;color:#fff;line-height:1.05}
.ppt b.zero{color:var(--faint)}
.ppt small{font-size:11px;font-weight:800;margin-top:3px;color:var(--faint)}
.ppt small.cbsx{color:var(--amber)}
.pnm{font-size:15px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;margin-top:4px}
.pnm small{font-size:12px;color:var(--faint);font-weight:700;margin-left:5px}
.pgm{font-size:12px;color:var(--faint);font-weight:600}
.pgm.live{color:var(--acc)} .pgm.fin{color:var(--muted)}
.mini{margin-top:5px;width:100%;max-width:140px}
.mini span{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:3px}
.mini span em{font-style:normal;color:#5cf29d;font-weight:800}
.pside.r .mini{align-self:flex-end}
.ctr{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.chev{width:30px;height:26px;border-radius:8px;border:1px solid var(--hair2);display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.prow[aria-expanded="true"] .chev{transform:rotate(180deg);color:#fff;border-color:rgba(255,255,255,.35)}
/* position squares */
.chip{justify-self:center;width:48px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;position:relative;
  --c:148,163,184;color:rgb(var(--c));border:1.5px solid rgba(var(--c),.85);background:linear-gradient(160deg,rgba(var(--c),.30),rgba(var(--c),.08) 60%,rgba(6,11,22,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 14px rgba(var(--c),.35);text-shadow:0 0 8px rgba(var(--c),.6);letter-spacing:.6px}
.chip.QB{--c:157,108,255}.chip.RB{--c:34,211,238}.chip.WR{--c:46,230,128}.chip.TE{--c:255,72,110}.chip.K{--c:255,145,40}.chip.DST{--c:176,190,208}
.chip.FLEX{color:#fff;border-color:transparent;background:linear-gradient(135deg,rgba(34,211,238,.9) 0 50%,rgba(46,230,128,.9) 50% 100%) border-box;box-shadow:0 0 14px rgba(40,220,180,.35);text-shadow:0 1px 2px rgba(0,0,0,.6);isolation:isolate}
.chip.FLEX::before{content:"";position:absolute;inset:1.5px;border-radius:7px;background:linear-gradient(135deg,rgba(13,40,52,.92) 0 50%,rgba(10,44,30,.92) 50% 100%);z-index:-1}
.prow.bench .chip{--c:106,132,160;color:var(--faint);border:1.5px dashed rgba(106,132,160,.6);background:rgba(255,255,255,.03);box-shadow:none;text-shadow:none}
/* tier bars */
.tb{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 4px}
.tb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(46,230,128,.35),#2ee680);box-shadow:0 0 10px rgba(46,230,128,.7)}
.tb.max i{background:linear-gradient(90deg,rgba(244,196,61,.4),var(--gold));box-shadow:0 0 10px rgba(244,196,61,.7)}
.mini .tb{height:5px;margin:0}
.gain{display:inline-block;padding:1px 6px;border-radius:7px;background:rgba(46,230,128,.14);border:1px solid rgba(46,230,128,.6);color:#5cf29d;font-weight:800;font-size:11px;box-shadow:0 0 10px rgba(46,230,128,.3);letter-spacing:.3px}
.gain.max{background:rgba(244,196,61,.14);border-color:rgba(244,196,61,.6);color:var(--gold);box-shadow:none}
/* condensed side-by-side drop-down */
.detail{display:grid;grid-template-columns:1fr 1fr;background:rgba(10,18,32,.95);border-top:1px solid rgba(147,174,200,.08)}
.dcol{padding:10px 12px 12px;display:flex;flex-direction:column;min-width:0}
.dcol+.dcol{border-left:1px solid rgba(147,174,200,.12)}
.grp{padding:6px 0;border-top:1px solid rgba(147,174,200,.10)}
.grp:first-child{border-top:0;padding-top:0}
.dl{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dl span{font-size:12px;font-weight:800;letter-spacing:.6px;color:#fff;min-width:0}
.dl em{font-style:normal;font-weight:600;letter-spacing:0;color:var(--muted)}
.pv{flex:none;min-width:34px;height:24px;padding:0 7px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--hair2)}
.pv.td{color:var(--gold)}
.pv.neg{color:var(--red)}
.pv.cbs{color:var(--amber)}
.dcol .tb{height:6px;margin:1px 0 0}
.dsub{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--faint);margin-top:3px;gap:6px}
.dtot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;padding-top:7px;border-top:1px solid rgba(147,174,200,.14)}
.dtot span{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.pv.total{height:30px;min-width:46px;font-size:17px;border:1.5px solid rgba(var(--acc-rgb),.85);background:rgba(var(--acc-rgb),.14);box-shadow:0 0 12px rgba(var(--acc-rgb),.3)}
.cbsl{color:var(--amber)!important}
/* event badge + score glow (pulse ~10 s, hold 3 min; score glows 60 s) */
.evt{align-self:flex-start;margin-top:3px;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:6px}
.evt.pulse{animation:evt 1.2s ease-in-out 8}
.pside.r .evt{align-self:flex-end}
.evt.td{color:#1b1300;background:var(--gold);box-shadow:0 0 12px rgba(244,196,61,.6)}
.evt.fum{color:#fff;background:var(--red);box-shadow:0 0 12px rgba(255,59,78,.6)}
@keyframes evt{50%{transform:scale(1.06);filter:brightness(1.25)}}
.ppt b.glow{color:#fff;text-shadow:0 0 14px rgba(var(--acc-rgb),.9);animation:sg 1.6s ease-in-out infinite}
@keyframes sg{50%{text-shadow:0 0 4px rgba(var(--acc-rgb),.4)}}
.empty{padding:24px 14px;text-align:center;color:var(--faint);font-size:14px;font-weight:600}
.note{margin-top:16px;font-size:12px;color:var(--faint);text-align:center;font-weight:600}
.soon{margin-top:30px;border:1px solid var(--hair);background:var(--card);border-radius:18px;padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:8px}
.soon b{font-size:20px;font-weight:800;color:#fff}.soon span{font-size:15px;color:var(--muted)}

/* ---- standings ---- */
.stcard{border:1px solid var(--hair);background:var(--card);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 24px rgba(0,0,0,.42);margin-bottom:14px;overflow:hidden}
.sthead,.strow{display:grid;grid-template-columns:18px 30px 1fr 44px 34px 40px;align-items:center;gap:8px;padding:0 14px}
.sthead{height:40px;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--hair)}
.sthead b{grid-column:1/4;font-size:13px;letter-spacing:1.8px;color:var(--acc)}
.sthead span,.strow .stwl,.strow .stgb,.strow .stk{text-align:right}
.strow{width:100%;min-height:52px;text-align:left;border-top:1px solid rgba(147,174,200,.07)}
.strow:first-of-type{border-top:0}
.strow .rk{font-size:12px;font-weight:800;color:var(--faint);text-align:center}
.strow .badge{width:30px;height:30px;border-radius:8px;font-size:10px}
.strow .stn{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strow .stwl{font-size:15px;font-weight:800;color:#fff}
.strow .stgb{font-size:13px;font-weight:700;color:var(--muted)}
.strow .stk{font-size:12px;font-weight:800;color:var(--muted)}
.strow .stk.w{color:var(--green)} .strow .stk.l{color:var(--red)}
.strow.me{background:linear-gradient(90deg,rgba(var(--acc-rgb),.20),rgba(var(--acc-rgb),.05) 70%,rgba(var(--acc-rgb),.02));box-shadow:inset 3px 0 0 var(--acc)}
.strow.me .stn{color:#fff}.strow.me .rk{color:var(--acc)}
.stdet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 14px 14px 70px}
.stdet div{display:flex;flex-direction:column;gap:2px}
.stdet small{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.stdet b{font-size:16px;font-weight:800;color:#fff}

/* ---- sheets (Pick'em) ---- */
.overlay{position:fixed;inset:0;overscroll-behavior:contain;background:rgba(2,5,12,.66);display:flex;align-items:flex-end;justify-content:center;z-index:60;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .26s ease,visibility 0s linear .34s}
.overlay.show{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .26s ease,visibility 0s linear 0s}
.sheet,.confirmcard{position:relative;width:100%;max-width:480px;background:linear-gradient(180deg,#111e33,#0b1321 60%);border-top:1px solid rgba(147,174,200,.16);border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.55);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.overlay.show .sheet,.overlay.show .confirmcard{transform:none}
.sheet::before,.confirmcard::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:rgba(147,174,200,.3);margin:0 auto 16px}
.sheet{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
html.ios .sheet{max-height:calc(var(--vvh,1vh)*88)}
@supports (height:100dvh){html.ios .sheet{max-height:88dvh}}
.sheet h2{margin:0;color:#fff;font-size:19px;font-weight:800;letter-spacing:-.3px}

const CHANGELOG = [

/* Turns one player's stat line into league points plus the pieces the drop-down shows.

function scoreStats(pos, s){
  const out = { pts: 0, bars: [], lines: [] };
  if(!s) return out;
  const line = function(lab, em, v, cls){ out.pts += v; out.lines.push({ lab: lab, em: em, v: v, cls: cls || '' }); };
  if(pos === 'DST'){
    const d = s.dst || {};
    const pa = Math.max(0, Math.round(d.pa || 0));
    line('PTS ALLOWED', String(pa), paPts(pa));
    if(d.sk) line('SACKS', String(d.sk), d.sk);
    if(d.int) line('INT', String(d.int), d.int);
    if(d.fr) line('FUM REC', String(d.fr), d.fr);
    if(d.td) line('D/ST TD', String(d.td), 6 * d.td, 'td');
    if(d.sf) line('SAFETY', String(d.sf), 2 * d.sf);
    return out;
  }
  if(pos === 'K'){
    const fg = s.fg || [];
    if(fg.length) line('FG', lensTxt(fg), fg.reduce(function(a, l){ return a + fgPts(l); }, 0));
    if(s.xp) line('XP', String(s.xp), s.xp);
    if(!fg.length && !s.xp) line('FG', 'none yet', 0);
    return out;
  }
  const bar = function(k, y, T){ y = Math.round(y || 0); const v = tierPts(y, T); out.pts += v; out.bars.push({ k: k, y: y, T: T, v: v }); };
  if(pos === 'QB'){ bar('PASS', s.py, PASS); bar('RUSH', s.ry, SKILL); if(s.cy) bar('REC', s.cy, SKILL); }
  else {
    if((s.py || 0) >= 75) bar('PASS', s.py, PASS);
    if(pos === 'RB'){ bar('RUSH', s.ry, SKILL); bar('REC', s.cy, SKILL); }
    else { bar('REC', s.cy, SKILL); if(s.ry || s.rcar) bar('RUSH', s.ry, SKILL); }
  }
  const tds = function(lab, a){ if(a && a.length) line(lab, lensTxt(a), a.reduce(function(t, l){ return t + tdPts(l); }, 0), 'td'); };
  tds('PASS TD', s.ptd); tds('RUSH TD', s.rtd); tds('REC TD', s.ctd);
  if(s.ktd) line('RETURN TD', String(s.ktd), 6 * s.ktd, 'td');
  if(s.two) line('2PT', String(s.two), 2 * s.two, 'td');
  if(s.pint) line('INT', String(s.pint), -s.pint, 'neg');
  if(s.fl) line('FUM LOST', String(s.fl), -s.fl, 'neg');
  return out;
}

/* CBS's own stat string, e.g. "271 PaYd, 3 PaTD (47,4,8), 7 RuYd, RuTD (1)" or "12 PA, DFR".
   Used as the fallback when ESPN can't be matched, and for past weeks. */
function parseCbsStats(str, pos, started){
  const s = { py:0, ptd:[], pint:0, ry:0, rcar:0, rtd:[], cy:0, ctd:[], fl:0, two:0, ktd:0, fg:[], xp:0, dst:{ pa:0, sk:0, int:0, fr:0, td:0, sf:0 } };

  raw.split(/,\s*(?![^()]*\))/).forEach(function(tok){
    const m = /^(-?\d+(?:\.\d+)?)?\s*([A-Za-z0-9]+)\s*(?:\(([^)]*)\))?$/.exec(trim(tok));
    if(!m) return;
    const has = m[1] != null, n = has ? parseFloat(m[1]) : 1, code = m[2].toUpperCase();
    const lens = m[3] ? m[3].split(',').map(function(x){ const v = parseInt(x, 10); return isFinite(v) ? v : null; }) : [];
    const list = function(){ const a = lens.slice(); const want = has ? n : Math.max(1, lens.length); while(a.length < want) a.push(null); return a; };
    switch(code){
      case 'PAYD': s.py = n; break;
      case 'PATD': s.ptd = list(); break;
      case 'PAINT': s.pint = n; break;
      case 'RUYD': s.ry = n; break;
      case 'RUTD': s.rtd = list(); break;
      case 'REYD': s.cy = n; break;
      case 'RETD': s.ctd = list(); break;
      case 'FL': s.fl = n; break;
      case 'KRTD': case 'PRTD': case 'FRTD': case 'RETD2': s.ktd += n; break;
      case 'FG': s.fg = list(); break;
      case 'XP': s.xp = n; break;
      case 'PA': s.dst.pa = n; break;
      case 'SACK': s.dst.sk = Math.round(n); break;
      case 'INT': s.dst.int = n; break;
      case 'DFR': case 'FR': s.dst.fr = n; break;
      case 'DTD': case 'DSTTD': case 'TD': s.dst.td = n; break;
      case 'SFTY': case 'SAF': case 'SAFETY': s.dst.sf = n; break;
      default:
        if(/2PT|TWOPT|PA2P|RU2P|RE2P/.test(code)) s.two += n;
    }
  });
  return s;
}

/* ---------- ESPN box score -> per-player stat lines ---------- */
function parseSummary(sm){

      else if(x.name === 'interceptions') T.tint = Math.max(T.tint, num(x.displayValue));

// find a name in a map keyed by normName, with a last-name (+ first initial) fallback inside one team
function findKey(map, name){

  const parts = k.split(' '); if(!parts.length || !parts[0]) return null;

/* ---------- pin: lift and glide to the top (FLIP) ---------- */
function cardTops(){ const o = {}; document.querySelectorAll('#cards .mc').forEach(function(c){ o[c.dataset.key] = c.getBoundingClientRect().top; }); return o; }
function flipFrom(before, lift){
  const cards = document.querySelectorAll('#cards .mc'); let any = false;
  cards.forEach(function(c){
    const b = before[c.dataset.key]; if(b == null) return;
    const d = b - c.getBoundingClientRect().top; if(Math.abs(d) < 1) return;
    any = true; c.style.transition = 'none'; c.style.transform = 'translateY(' + d + 'px)';
    if(c.dataset.key === lift) c.classList.add('lift');
  });
  if(!any) return;
  holdRender = Date.now() + 650;
  void document.body.offsetWidth;
  requestAnimationFrame(function(){
    cards.forEach(function(c){ if(!c.style.transform) return; c.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)'; c.style.transform = ''; });
    setTimeout(function(){ cards.forEach(function(c){ c.style.transition = ''; c.classList.remove('lift'); }); holdRender = 0; if(renderQueued) render(); }, 620);
  });
}
function togglePin(key){
  const m = weekModel(); if(!m) return;
  const mt = m.matchups.find(function(x){ return x.key === key; }); if(!mt) return;
  const ids = [mt.home && mt.home.id, mt.away && mt.away.id].filter(Boolean);
  const on = ids.some(function(id){ return S.pins.indexOf(id) >= 0; });
  const before = cardTops();
  if(on) S.pins = S.pins.filter(function(id){ return ids.indexOf(id) < 0; });
  else S.pins = ids.concat(S.pins.filter(function(id){ return ids.indexOf(id) < 0; }));
  put('pins', S.pins);
  render();
  flipFrom(before, on ? null : key);
}

/* ---------- press-and-hold drag to reorder (Pick'em: blocker registered once, at load) ---------- */
let press = null;
document.addEventListener('touchmove', function(e){ if(press && press.active && e.cancelable) e.preventDefault(); }, { passive: false });
function pressStart(card, y){
  if(press) return;
  press = { card: card, y0: y, last: y, active: false };
  press.timer = setTimeout(pressActivate, 380);
}
function pressActivate(){
  if(!press) return;
  const card = press.card, grp = card.dataset.grp;
  const group = Array.from(document.querySelectorAll('#cards .mc')).filter(function(c){ return c.dataset.grp === grp; });
  if(group.length < 2){ press = null; return; }
  press.active = true; press.group = group; press.idx = group.indexOf(card); press.target = press.idx;
  press.rects = group.map(function(c){ const r = c.getBoundingClientRect(); return { top: r.top, h: r.height }; });
  press.gap = group.length > 1 ? Math.max(0, press.rects[1].top - press.rects[0].top - press.rects[0].h) : 9;
  press.yAct = press.last; press.sy = window.scrollY;
  card.classList.add('dragging'); document.body.classList.add('dragmode');
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
}
function pressMove(y){
  if(!press) return; press.last = y;
  if(!press.active){ if(Math.abs(y - press.y0) > 8) pressCancel(); return; }
  const dy = y - press.yAct + (window.scrollY - press.sy), R = press.rects, i = press.idx;
  press.card.style.transform = 'translateY(' + dy + 'px)';
  const c = R[i].top + R[i].h / 2 + dy;
  let t = i;
  for(let j = 0; j < R.length; j++){ const mid = R[j].top + R[j].h / 2; if(j < i && c < mid) t = Math.min(t, j); if(j > i && c > mid) t = Math.max(t, j); }
  const H = R[i].h + press.gap;
  press.group.forEach(function(el, j){ if(j === i) return; let s = 0; if(i < t && j > i && j <= t) s = -H; if(i > t && j >= t && j < i) s = H; el.style.transform = s ? 'translateY(' + s + 'px)' : ''; });
  press.target = t;
}
function pressCancel(){ if(!press) return; clearTimeout(press.timer); press = null; }
function pressEnd(){
  if(!press) return;
  clearTimeout(press.timer);
  const p = press; press = null;
  if(!p.active) return;
  justDragged = Date.now();
  document.body.classList.remove('dragmode');
  const before = {};
  document.querySelectorAll('#cards .mc').forEach(function(c){ before[c.dataset.key] = c.getBoundingClientRect().top; });
  p.group.forEach(function(el){ el.style.transform = ''; el.style.transition = 'none'; });
  p.card.classList.remove('dragging');
  // new order for this group, saved by team so it carries week to week
  const keys = p.group.map(function(c){ return c.dataset.key; });
  const moved = keys.splice(p.idx, 1)[0]; keys.splice(p.target, 0, moved);
  const all = Array.from(document.querySelectorAll('#cards .mc')).map(function(c){ return c.dataset.key; });
  const others = all.filter(function(k){ return keys.indexOf(k) < 0; });
  const grp = p.card.dataset.grp, finalKeys = grp === 'pin' ? keys.concat(others) : others.concat(keys);
  const m = weekModel();
  if(m){
    const ids = [];
    finalKeys.forEach(function(k){ const mt = m.matchups.find(function(x){ return x.key === k; }); if(mt){ [mt.home, mt.away].forEach(function(t){ if(t) ids.push(t.id); }); } });
    if(grp === 'pin'){ const pinIds = []; keys.forEach(function(k){ const mt = m.matchups.find(function(x){ return x.key === k; }); if(mt) [mt.home, mt.away].forEach(function(t){ if(t && S.pins.indexOf(t.id) >= 0) pinIds.push(t.id); }); }); S.pins = pinIds.concat(S.pins.filter(function(id){ return pinIds.indexOf(id) < 0; })); put('pins', S.pins); }
    S.order = ids.concat(S.order.filter(function(id){ return ids.indexOf(id) < 0; })); put('order', S.order);
  }
  render();
  p.group.forEach(function(el){ el.style.transition = ''; });

}
const cardsHost = $('#view');

/* ---------- data: CBS (through the Worker), ESPN scoreboard + box scores ---------- */
const busy = {};
function loadCbs(week){
  const key = 'cbs' + (week || 'cur');
  if(busy[key]) return;
  busy[key] = true;
  return getJSON(WORKER + '/live' + (week ? '?week=' + week : ''))
    .then(function(j){

  if(now - updLastCheck < (reason === 'wake' ? 60000 : 240000)) return;
  updChecking = true;

      const wa = new Uint8Array(N); let w = 0;
      for(let i = 0; i < N; i++){ let x = ta[i] > tb[i] ? 1 : ta[i] < tb[i] ? 0 : (A.bench[i] > (B ? B.bench[i] : 0) ? 1 : A.bench[i] < (B ? B.bench[i] : 0) ? 0 : 0.5); if(x === 0.5) x = (i & 1); wa[i] = x; w += x; }

      res.tot[mt.a] = ta; res.win[mt.a] = wa;
      if(B){ res.tot[mt.b] = tb; const wb = new Uint8Array(N); for(let i = 0; i < N; i++) wb[i] = 1 - wa[i]; res.win[mt.b] = wb; }
    });
    if(live) msg.teams && Object.keys(msg.teams).forEach(function(id){ msg.teams[id].bench.forEach(function(q){ const a = simPlayer(q); res.p[q.pid] = [mean(a), pct(a, 0.2), pct(a, 0.8)]; }); });
    return res;
  }
  // best lineup by neutral mean for a future week (Drop 1 §4.5)
  function futureTeam(T, wk){
    const bye = BYES[wk] || [], pool = { QB: [], RB: [], WR: [], TE: [], K: [], DST: [] };
    T.roster.forEach(function(q){ const r = P[q.key]; if(!r || q.ir || bye.indexOf(q.nfl) >= 0 || !pool[q.pos]) return; pool[q.pos].push({ m: r.nm || 0, v: Math.pow(r.ns || 0, 2) }); });
    Object.keys(pool).forEach(function(k){ pool[k].sort(function(a, b){ return b.m - a.m; }); });
    const take = function(k){ return pool[k].length ? pool[k].shift() : { m: 0, v: 0 }; };

    const fx = (pool.RB[0] || { m: -1 }).m >= (pool.WR[0] || { m: -1 }).m ? take('RB') : take('WR'); L.push(fx);
    let m = 0, v = 0; L.forEach(function(x){ m += x.m; v += x.v; });

  function playoff(msg, wk){

    const cnt = {}; ids.forEach(function(id){ cnt[id] = 0; });
    const fut = {}; S.future.forEach(function(F){ fut[F.w] = {}; ids.forEach(function(id){ fut[F.w][id] = futureTeam(msg.teams[id] || { roster: [] }, F.w); }); });

      const game = function(a, b, sa, sb, ba, bb){ let x = sa > sb ? 1 : sa < sb ? 0 : (ba > bb ? 1 : ba < bb ? 0 : R.u() < 0.5 ? 1 : 0);

        pairs.forEach(function(pr){ const A = fut[F.w][pr[0]], B = fut[F.w][pr[1]]; if(!A || !B) return;
          game(pr[0], pr[1], Math.round(A.m + A.s * R.n()), Math.round(B.m + B.s * R.n()), A.bm + A.bs * R.n(), B.bm + B.bs * R.n()); });
      });
      const divs = {}; ids.forEach(function(id){ (divs[S.teams[id].div] || (divs[S.teams[id].div] = [])).push(id); });
      Object.keys(divs).forEach(function(d){
        divs[d].sort(function(a, b){ return (W[b] - W[a]) || (DW[b] - DW[a]) || (PF[b] - PF[a]) || (PAg[b] - PAg[a]); });

  }
  self.onmessage = function(e){
    const msg = e.data;
    if(msg.type === 'proj'){ P = {}; (msg.proj.players || []).forEach(function(r){ P[r.k] = r; }); LG = msg.proj.lg_ppg || 22; BYES = msg.proj.byes || {}; cache = {}; return; }
    if(msg.type !== 'run') return;
    try{
      Object.keys(cache).forEach(function(k){ if(k.indexOf('live|') === 0 && !msg.keep[k]) delete cache[k]; });

      const po = msg.season ? playoff(msg, live) : null, po0 = msg.season ? playoff(msg, pre) : null;

}

const NV_TEAM = { WSH: 'WAS', LAR: 'LA' };
function nvTeam(ab){ return NV_TEAM[ab] || ab; }
const ENG = { worker: null, busy: false, sig: '', id: 0, res: null, projAt: 0, err: '', fut: {}, futAt: {} };
S.proj = null;
function engineStart(){
  if(ENG.worker || typeof Worker !== 'function') return;
  try{ ENG.worker = new Worker(URL.createObjectURL(new Blob(['(' + engineWorker.toString() + ')()'], { type: 'text/javascript' }))); }
  catch(e){ ENG.err = 'worker'; return; }
  ENG.worker.onmessage = function(e){
    const d = e.data; ENG.busy = false;
    if(d.type === 'done' && d.id === ENG.id){ ENG.res = d; ENG.at = Date.now(); render(); }
    else if(d.type === 'error') ENG.err = d.err;
    engineTick();
  };

}
function loadProj(){
  if(busy.proj) return; busy.proj = true;
  return getJSON('projections.json?t=' + Date.now())
    .then(function(j){
      if(!j || !Array.isArray(j.players)) return;
      if(S.proj && S.proj.raw.generated === j.generated) return;
      const byKey = {}, byName = {};
      j.players.forEach(function(r){ byKey[r.k] = r; const nm = r.k.split('|')[0]; (byName[nm] || (byName[nm] = [])).push(r); });
      S.proj = { raw: j, week: j.week, at: Date.parse(j.generated) || 0, byKey: byKey, byName: byName };
      ENG.sig = ''; ENG.res = null;
      if(ENG.worker) ENG.worker.postMessage({ type: 'proj', proj: j });
    })
    .catch(function(){})
    .then(function(){ busy.proj = false; ENG.projAt = Date.now(); engineTick(); render(); });
}
function projFor(pl){
  const P = S.proj; if(!P || !pl) return null;
  const t = nvTeam(pl.nfl);
  if(pl.pos === 'DST') return P.byKey['DST|' + t] || null;
  const nm = normName(pl.name);
  if(P.byKey[nm + '|' + t]) return P.byKey[nm + '|' + t];
  const same = (P.byName[nm] || []).filter(function(r){ return r.p === pl.pos; });
  if(same.length === 1) return same[0];
  const last = nm.split(' ').pop(), fi = nm[0];
  const c = P.raw.players.filter(function(r){ return r.t === t && r.p === pl.pos && r.k.split('|')[0].split(' ').pop() === last; });
  const c2 = c.filter(function(r){ return r.k[0] === fi; });
  return c2.length === 1 ? c2[0] : (c.length === 1 ? c[0] : null);
}
function engineReady(){ return !!(S.proj && S.curWeek && S.proj.week === S.curWeek && S.week === S.curWeek); }
// minutes left in regulation -> fraction of the game still to play
function gameFrac(g){
  if(!g) return 1;
  if(g.state === 'post') return 0;
  if(g.state !== 'in') return 1;
  const n = (g.statusName || '').toUpperCase(), p = g.period || 1;
  if(p > 4) return 0.03;
  if(n.indexOf('HALFTIME') >= 0) return 0.5;
  const parts = String(g.clock || '0:00').split(':'), mins = (parseInt(parts[0], 10) || 0) + (parseInt(parts[1], 10) || 0) / 60;
  const left = n.indexOf('END_PERIOD') >= 0 || n.indexOf('END_OF') >= 0 ? (4 - p) * 15 : (4 - p) * 15 + mins;
  return clamp(left / 60, 0, 1);
}
function engState(pl, L){
  const r = projFor(pl);
  const q = { pid: pl.id, key: r ? r.k : '', pos: pl.pos, nfl: nvTeam(pl.nfl), wr1: !!(r && r.wr1), mode: 'pre' };
  if(!r) q.mode = 'none';
  if(!L) return q;
  if(L.state === 'bye'){ q.mode = 'final'; q.pts = 0; return q; }
  if(L.state === 'post'){ q.mode = 'final'; q.pts = L.pts || 0; return q; }
  if(L.state === 'in' && L.s){
    const s = L.s, sum = function(a){ return (a || []).reduce(function(t, l){ return t + tdPts(l); }, 0); };
    const has = !!(s.py || s.ry || s.cy || s.rcar || (s.ptd || []).length || (s.rtd || []).length || (s.ctd || []).length || (s.fg || []).length || s.xp) || pl.pos === 'DST';

}
function seasonInputs(m){

    teams[id] = { div: t.division || d.id, w: num(t.wins), l: num(t.losses), t: num(t.ties), dw: num(t.division_wins), dt: num(t.division_ties), pf: num(t.points_scored), pa: num(t.points_against) }; }); });

function loadFuture(){

function engineTick(){
