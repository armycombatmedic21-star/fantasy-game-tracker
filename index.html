<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<style>html,body{background:#060b16}</style>
<meta name="theme-color" content="#060b16">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link id="manifestLink" rel="manifest">
<link id="touchIcon" rel="apple-touch-icon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Tracker">
<meta name="mobile-web-app-capable" content="yes">
<title>Game Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"></noscript>
<style>
/* ===================== Fantasy Game Tracker =====================
   One file. Look = approved round 5 mock-up (Pick'em "premium glass", blue accent).
   Sections: tokens/base · header/status · scoreboard cards · matchup · standings ·
   sheets/overlays (Pick'em) · first-open gate (Pick'em) · tab bar (Pick'em Glass Pill) · motion */
:root{
  --bg:#060b16; --card:linear-gradient(180deg,#0e1829,#0b1321);
  --hair:rgba(147,174,200,.10); --hair2:rgba(147,174,200,.22);
  --acc:#4f8dff; --acc-rgb:79,141,255; --ink:#050f24;
  --gold:#f4c43d; --green:#3ddc84; --red:#ff3b4e; --amber:#ffb020;
  --text:#dce8f5; --muted:#93aec8; --faint:#6a84a0;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:contain}
body{background:var(--bg);background-image:linear-gradient(180deg,#0a1426 0,#060b16 260px);background-repeat:no-repeat;color:var(--text);font-family:var(--font);font-variant-numeric:tabular-nums;margin:0;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,.mc:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
img{display:block}

/* ---- header ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.kick{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--acc)}
h1{margin:3px 0 0;font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
.hbtns{display:flex;gap:8px}
.pill{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.04);font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.now{border-color:rgba(var(--acc-rgb),.7);color:var(--acc);box-shadow:0 0 14px rgba(var(--acc-rgb),.18)}
.gear{width:42px;height:42px;border-radius:50%;border:1px solid var(--hair2);background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.35}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:beacon 2s infinite;flex:none}
.dot.still{animation:none;background:var(--faint)}
.dot.bad{animation:none;background:var(--amber)}
@keyframes beacon{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.55)}70%{box-shadow:0 0 0 9px rgba(var(--acc-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),0)}}
.status b{color:var(--text);font-weight:800}
.status b.warn{color:var(--amber)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h2{margin:0;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.sec span{font-size:12px;color:var(--faint);font-weight:600;text-align:right}
.linkbtn{font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;margin:-6px 0}

.pick{width:100%;border-radius:18px;padding:20px;text-align:left;border:1.5px solid rgba(var(--acc-rgb),.75);background:linear-gradient(180deg,rgba(var(--acc-rgb),.10),rgba(var(--acc-rgb),.02));display:flex;align-items:center;gap:16px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 22px rgba(var(--acc-rgb),.35)}}
.pick .ic{width:50px;height:50px;border-radius:14px;background:var(--acc);color:var(--ink);display:grid;place-items:center;flex:none}
.pick strong{display:block;font-size:18px;font-weight:800;color:#fff}
.pick small{font-size:14px;color:var(--muted);font-weight:600}

/* ---- scoreboard cards ---- */
.mc{position:relative;border:1px solid var(--hair);background:var(--card);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 24px rgba(0,0,0,.42);padding:12px 16px 14px;margin-bottom:12px;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.mc.mine{border-color:rgba(var(--acc-rgb),.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(var(--acc-rgb),.12),0 10px 24px rgba(0,0,0,.42)}
.mchead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:26px}
.tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.mine .tag{color:var(--acc)}
.pin{width:34px;height:34px;margin:-6px 0 -6px -8px;display:grid;place-items:center;border-radius:9px;color:var(--faint);position:relative}
.pin::before{content:"";position:absolute;inset:-6px}
.pin[aria-pressed="true"]{color:var(--acc)}
.trow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;padding:6px 0}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--hair2);color:var(--text);overflow:hidden;flex:none}
.badge img{width:100%;height:100%;object-fit:cover}
.tn{min-width:0}
.tn b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn small{font-size:13px;color:var(--faint);font-weight:600}
.sc{text-align:right}
.sc b{display:block;font-size:25px;font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1.05}
.sc small{font-size:12px;color:var(--faint);font-weight:700}
.trow.lead .sc b{color:var(--green)}
.engine{text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin-top:6px}
.mc .engine{margin-top:8px;padding-top:9px;border-top:1px solid var(--hair)}

.mc.lg{padding:10px 14px 11px;margin-bottom:9px;border-radius:15px}
.mc.lg .mchead{position:absolute;top:7px;left:7px;margin:0;min-height:0;z-index:2}
.mc.lg .pin{margin:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);background:rgba(255,255,255,.04)}
.mc.lg .pin[aria-pressed="true"]{border-color:var(--acc);background:rgba(var(--acc-rgb),.18);box-shadow:0 0 10px rgba(var(--acc-rgb),.35)}
.mc.lg .rows{padding-left:0;padding-top:16px}
.mc.lg .trow{grid-template-columns:30px 1fr auto;gap:10px;padding:3px 0}
.mc.lg .badge{width:30px;height:30px;border-radius:8px;font-size:11px}
.mc.lg .tn b{font-size:17px;display:inline}
.mc.lg .tn small{font-size:13px;margin-left:6px}
.mc.lg .sc{display:flex;align-items:baseline;gap:8px}
.mc.lg .sc b{font-size:22px;order:2}
.mc.lg .sc small{font-size:12px;order:1}
.mc.lg .left{position:absolute;top:9px;right:14px;font-size:10px}

/* ---- matchup screen ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back{height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--hair2);color:var(--acc);font-weight:800;font-size:14px}
.mtitle{font-size:14px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#fff}
.hero{border:1px solid var(--hair);background:var(--card);border-radius:20px;padding:16px 14px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.hgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.hteam{display:flex;flex-direction:column;gap:6px;min-width:0}
.hteam.r{align-items:flex-end;text-align:right}
.hteam .badge{width:48px;height:48px;border-radius:15px;font-size:14px}
.hteam b{font-size:17px;font-weight:800;line-height:1.15}
.hteam small{font-size:13px;color:var(--faint);font-weight:600}
.hsc{display:grid;grid-template-columns:auto auto;gap:2px 18px;text-align:center}
.hsc b{font-size:34px;font-weight:800;letter-spacing:-1px;color:#fff;line-height:1.05}
.hsc b.lead{color:var(--green)}
.hsc em{grid-column:1/-1;font-style:normal;font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase;margin-top:4px}
.swipehint{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dots{display:flex;justify-content:center;gap:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots i.on{background:var(--acc)}
.arrow{width:44px;height:38px;border-radius:10px;color:var(--muted);font-size:22px;font-weight:800;display:grid;place-items:center}

.plist{margin-top:14px;border:1px solid var(--hair);background:#0b1321;border-radius:18px;overflow:hidden}
.plabel{padding:12px 14px 8px;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.prow{display:grid;grid-template-columns:1fr 52px 1fr;align-items:start;gap:6px;padding:12px;border-top:1px solid rgba(147,174,200,.08);width:100%;text-align:left}
.pside{min-width:0;display:flex;flex-direction:column;gap:3px}
.pside.r{align-items:flex-end;text-align:right}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.pside.r .ptop{flex-direction:row-reverse}
.nfl{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--hair);overflow:hidden}
.nfl img{width:24px;height:24px;object-fit:contain}
.ppt{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.pside.r .ppt{align-items:flex-start}
.ppt b{font-size:22px;font-weight:800;color:#fff;line-height:1.05}
.ppt b.zero{color:var(--faint)}
.ppt small{font-size:11px;font-weight:800;margin-top:3px;color:var(--faint)}
.ppt small.cbsx{color:var(--amber)}
.pnm{font-size:15px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;margin-top:4px}
.pnm small{font-size:12px;color:var(--faint);font-weight:700;margin-left:5px}
.pgm{font-size:12px;color:var(--faint);font-weight:600}
.pgm.live{color:var(--acc)} .pgm.fin{color:var(--muted)}
.mini{margin-top:5px;width:100%;max-width:140px}
.mini span{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:3px}
.mini span em{font-style:normal;color:#5cf29d;font-weight:800}
.pside.r .mini{align-self:flex-end}
.ctr{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.chev{width:30px;height:26px;border-radius:8px;border:1px solid var(--hair2);display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.prow[aria-expanded="true"] .chev{transform:rotate(180deg);color:#fff;border-color:rgba(255,255,255,.35)}
/* position squares */
.chip{justify-self:center;width:48px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;position:relative;
  --c:148,163,184;color:rgb(var(--c));border:1.5px solid rgba(var(--c),.85);background:linear-gradient(160deg,rgba(var(--c),.30),rgba(var(--c),.08) 60%,rgba(6,11,22,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 14px rgba(var(--c),.35);text-shadow:0 0 8px rgba(var(--c),.6);letter-spacing:.6px}
.chip.QB{--c:157,108,255}.chip.RB{--c:34,211,238}.chip.WR{--c:46,230,128}.chip.TE{--c:255,72,110}.chip.K{--c:255,145,40}.chip.DST{--c:176,190,208}
.chip.FLEX{color:#fff;border-color:transparent;background:linear-gradient(135deg,rgba(34,211,238,.9) 0 50%,rgba(46,230,128,.9) 50% 100%) border-box;box-shadow:0 0 14px rgba(40,220,180,.35);text-shadow:0 1px 2px rgba(0,0,0,.6);isolation:isolate}
.chip.FLEX::before{content:"";position:absolute;inset:1.5px;border-radius:7px;background:linear-gradient(135deg,rgba(13,40,52,.92) 0 50%,rgba(10,44,30,.92) 50% 100%);z-index:-1}
.prow.bench .chip{--c:106,132,160;color:var(--faint);border:1.5px dashed rgba(106,132,160,.6);background:rgba(255,255,255,.03);box-shadow:none;text-shadow:none}
/* tier bars */
.tb{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 4px}
.tb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(46,230,128,.35),#2ee680);box-shadow:0 0 10px rgba(46,230,128,.7)}
.tb.max i{background:linear-gradient(90deg,rgba(244,196,61,.4),var(--gold));box-shadow:0 0 10px rgba(244,196,61,.7)}
.mini .tb{height:5px;margin:0}
.gain{display:inline-block;padding:1px 6px;border-radius:7px;background:rgba(46,230,128,.14);border:1px solid rgba(46,230,128,.6);color:#5cf29d;font-weight:800;font-size:11px;box-shadow:0 0 10px rgba(46,230,128,.3);letter-spacing:.3px}
.gain.max{background:rgba(244,196,61,.14);border-color:rgba(244,196,61,.6);color:var(--gold);box-shadow:none}
/* condensed side-by-side drop-down */
.detail{display:grid;grid-template-columns:1fr 1fr;background:rgba(10,18,32,.95);border-top:1px solid rgba(147,174,200,.08)}
.dcol{padding:10px 12px 12px;display:flex;flex-direction:column;min-width:0}
.dcol+.dcol{border-left:1px solid rgba(147,174,200,.12)}
.grp{padding:6px 0;border-top:1px solid rgba(147,174,200,.10)}
.grp:first-child{border-top:0;padding-top:0}
.dl{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dl span{font-size:12px;font-weight:800;letter-spacing:.6px;color:#fff;min-width:0}
.dl em{font-style:normal;font-weight:600;letter-spacing:0;color:var(--muted)}
.pv{flex:none;min-width:34px;height:24px;padding:0 7px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--hair2)}
.pv.td{color:var(--gold)}
.pv.neg{color:var(--red)}
.pv.cbs{color:var(--amber)}
.dcol .tb{height:6px;margin:1px 0 0}
.dsub{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--faint);margin-top:3px;gap:6px}
.dtot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;padding-top:7px;border-top:1px solid rgba(147,174,200,.14)}
.dtot span{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.pv.total{height:30px;min-width:46px;font-size:17px;border:1.5px solid rgba(var(--acc-rgb),.85);background:rgba(var(--acc-rgb),.14);box-shadow:0 0 12px rgba(var(--acc-rgb),.3)}
.cbsl{color:var(--amber)!important}
/* event badge + score glow (pulse ~10 s, hold 3 min; score glows 60 s) */
.evt{align-self:flex-start;margin-top:3px;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:6px}
.evt.pulse{animation:evt 1.2s ease-in-out 8}
.pside.r .evt{align-self:flex-end}
.evt.td{color:#1b1300;background:var(--gold);box-shadow:0 0 12px rgba(244,196,61,.6)}
.evt.fum{color:#fff;background:var(--red);box-shadow:0 0 12px rgba(255,59,78,.6)}
@keyframes evt{50%{transform:scale(1.06);filter:brightness(1.25)}}
.ppt b.glow{color:#fff;text-shadow:0 0 14px rgba(var(--acc-rgb),.9);animation:sg 1.6s ease-in-out infinite}
@keyframes sg{50%{text-shadow:0 0 4px rgba(var(--acc-rgb),.4)}}
.empty{padding:24px 14px;text-align:center;color:var(--faint);font-size:14px;font-weight:600}
.note{margin-top:16px;font-size:12px;color:var(--faint);text-align:center;font-weight:600}
.soon{margin-top:30px;border:1px solid var(--hair);background:var(--card);border-radius:18px;padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:8px}
.soon b{font-size:20px;font-weight:800;color:#fff}.soon span{font-size:15px;color:var(--muted)}

/* ---- standings ---- */
.stcard{border:1px solid var(--hair);background:var(--card);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 24px rgba(0,0,0,.42);margin-bottom:14px;overflow:hidden}
.sthead,.strow{display:grid;grid-template-columns:18px 30px 1fr 44px 34px 40px;align-items:center;gap:8px;padding:0 14px}
.sthead{height:40px;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--hair)}
.sthead b{grid-column:1/4;font-size:13px;letter-spacing:1.8px;color:var(--acc)}
.sthead span,.strow .stwl,.strow .stgb,.strow .stk{text-align:right}
.strow{width:100%;min-height:52px;text-align:left;border-top:1px solid rgba(147,174,200,.07)}
.strow:first-of-type{border-top:0}
.strow .rk{font-size:12px;font-weight:800;color:var(--faint);text-align:center}
.strow .badge{width:30px;height:30px;border-radius:8px;font-size:10px}
.strow .stn{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strow .stwl{font-size:15px;font-weight:800;color:#fff}
.strow .stgb{font-size:13px;font-weight:700;color:var(--muted)}
.strow .stk{font-size:12px;font-weight:800;color:var(--muted)}
.strow .stk.w{color:var(--green)} .strow .stk.l{color:var(--red)}
.strow.me{background:linear-gradient(90deg,rgba(var(--acc-rgb),.20),rgba(var(--acc-rgb),.05) 70%,rgba(var(--acc-rgb),.02));box-shadow:inset 3px 0 0 var(--acc)}
.strow.me .stn{color:#fff}.strow.me .rk{color:var(--acc)}
.stdet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 14px 14px 70px}
.stdet div{display:flex;flex-direction:column;gap:2px}
.stdet small{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.stdet b{font-size:16px;font-weight:800;color:#fff}

/* ---- sheets (Pick'em) ---- */
.overlay{position:fixed;inset:0;overscroll-behavior:contain;background:rgba(2,5,12,.66);display:flex;align-items:flex-end;justify-content:center;z-index:60;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .26s ease,visibility 0s linear .34s}
.overlay.show{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .26s ease,visibility 0s linear 0s}
.sheet,.confirmcard{position:relative;width:100%;max-width:480px;background:linear-gradient(180deg,#111e33,#0b1321 60%);border-top:1px solid rgba(147,174,200,.16);border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.55);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.overlay.show .sheet,.overlay.show .confirmcard{transform:none}
.sheet::before,.confirmcard::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:rgba(147,174,200,.3);margin:0 auto 16px}
.sheet{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
html.ios .sheet{max-height:calc(var(--vvh,1vh)*88)}
@supports (height:100dvh){html.ios .sheet{max-height:88dvh}}

html.tbbend .tabbar .lens{-webkit-backdrop-filter:url(#lensf) blur(2.5px) brightness(.05) saturate(120%);backdrop-filter:url(#lensf) blur(2.5px) brightness(.05) saturate(120%)}

/* ---- toast, update bar ---- */

@keyframes updPulse{0%,100%{box-shadow:0 0 0 1px rgba(var(--acc-rgb),.9),0 0 10px rgba(var(--acc-rgb),.35)}50%{box-shadow:0 0 0 1px rgba(var(--acc-rgb),1),0 0 28px rgba(var(--acc-rgb),.75)}}

/* ---- motion: pin lift-and-glide, press-and-hold drag ---- */
.mc.lift{z-index:6;scale:1.03;box-shadow:0 0 0 1.5px rgba(var(--acc-rgb),.8),0 18px 40px rgba(0,0,0,.6),0 0 26px rgba(var(--acc-rgb),.4)!important}

<script>
(function(){
'use strict';
/* =====================================================================
   Fantasy Game Tracker — v1.1 (Prediction Engine)
   Data:  CBS lineups/standings via our Cloudflare Worker (fgt-lineups, 1 call/min to CBS)
          ESPN scoreboard (10 s while live) + per-game box scores (refetched when a new play happens)
   Score: our league's exact rules (Drop 1 §2), computed from ESPN; CBS fpts is the cross-check.
   ===================================================================== */
const APP_VERSION = '1.5.1';
const OWNERS = { '1': 'Darrell Hill', '2': 'Derek Sandstrom', '3': 'Mike Amarose', '4': 'Michael Hester', '5': 'Perry Holmes', '6': 'Donald Burse', '7': 'Mike Burse', '8': 'Dale LaPointe', '9': 'Mark Lamb', '10': 'Jason Bendickson', '11': 'Rick L. & Wes S.', '12': 'Brett LaLonde' };   // read once from CBS (Nov 8, 2026); edit here if an owner changes
function ownerOf(t){ return t ? (OWNERS[String(t.id)] || '') : ''; }
const CHANGELOG = [
  ['1.5.1', 'New week arrives on its own: every Tuesday at 6 AM the app switches to the new week by itself (no waiting for CBS). Lineup changes show up in about a minute.'],
  ['1.5.0', 'Standings are now built week by week: past weeks use CBS’s official scores, this week uses our live scores, and season totals add those up, so points and records can never be counted twice. Points Scored and Against now include games in progress, updating live.'],
  ['1.4.8', 'Playoff odds fixed: the regular season ends after Week 11, so odds now play out only the 2 weeks that are actually left (it was adding a made-up Week 12).'],
  ['1.4.7', 'After the week ends, playoff odds and the win bar stay on: finished games show 100% / 0% from the final scores, and playoff odds keep running while next week’s projections are already in.'],
  ['1.4.6', 'Once the week is final your phone remembers it, so reopening the app shows the new standings right away (no flicker back to last week). A game only counts as over when ESPN says Final.'],
  ['1.4.5', 'Faster end of week: after a game ends, the app checks every 30 seconds until ESPN’s final box score is in, so records update about 1–2 minutes after the final whistle.'],
  ['1.4.4', 'When CBS moves to the next week, the app moves with you right away if you were on the current week. Looking at an older week on purpose? It leaves you there.'],
  ['1.4.3', 'Updates install themselves within about 20 seconds (no more tap to update), with a quick “Updated to …” note. End of the week: the first time you open Standings, teams slide from last week’s spots to their new ones, the movers pulse, then “Records updated” shows. 6th place is white again.'],
  ['1.4.2', 'Cleaner look: an open player or team is one card with a softer blue background, no glows. Earned yards points show as green “+7”, and the next milestone “+3” is plain white. Standings drop-down shows Scored, Against and Differential side by side. Ranks are bigger and white; 6th place (outside the playoff spots) is red.'],
  ['1.4.1', 'Standings cleanup: a small drop-down arrow centered at the bottom of each team (tap anywhere on a team to open or close it), the streak column is gone so names get more room, the drop-down shows Avg. per game, and playoff odds read 100% (green) when a team is in and 0% (red) when it’s out. Dallas owners now show as Rick L. & Wes S.'],
  ['1.4.0', 'Standings update themselves: Points Scored and Points Against go up live during games, and records, division records, games back and streaks update the moment the whole week is final (after Monday night, overtime included) — no waiting for CBS. A badge and a “Records updated” banner tell you when. New MOVE column: green or red arrows show how many spots each team moved in its division since last week. New PLAYOFF % column: every team’s live chance to make the playoffs. Every team has its own drop-down arrow: open as many as you want to compare. Finished games now read 100% / 0%.'],
  ['1.3.6', 'More accurate win % late in the week: when only a player or two is left, the app now uses that position’s real range instead of a whole-team stretch (it overstated a lone kicker’s chances), and exact ties count again. Players back from injury or newly signed (no games yet this season) now get a projection instead of 0.'],
  ['1.3.5', 'Projections now blend our model 50/50 with FantasyPros consensus for every player (official FantasyPros API), refreshed automatically.'],
  ['1.3.4', 'Projections now refresh automatically every morning (plus Sunday before kickoffs and before Thursday and Monday night games). Win % spread checked against our league’s real Weeks 2–8 results.'],
  ['1.3.3', 'A small white arrow now points from “29 more yds” to the points it gets you. Projections sit beside the score so they never run into player names, and live game lines stay on one line (clock and score).'],
  ['1.3.2', 'Matchup rows: a thin line down the middle like FantasyPros, a square stats arrow centered under the position pill, and scores moved a little away from the pill. The bench now has its own color with a Bench header, so you always know you’re looking at the bench.'],
  ['1.3.1', 'Online strip shows full team names (Indianapolis = Indy). Owner names under every team in Standings. Fixed the chat typing cursor jumping around on iPhone. Pinch-zoom is off. Tap anywhere on an opened player’s stats to close them.'],
  ['1.3.0', 'League chat is live: one season-long chat (last 200 messages), every team in its own color as “Team (Owner)”, tap your own message to delete it, and an unread badge on the Chat tab. Who’s online: a blue dot next to every team with the app open, plus an Online strip on every tab; it turns on and off within about a second. Opening a player’s stats now outlines him and his stats as one block, with bolder lines between rows. Softer position pills with bigger letters. The ESPN/CBS status bar only shows up when something is wrong.'],
  ['1.2.0', 'Tighter matchup screen: rows about 20% shorter, bigger team logos, and a green score means that player is playing right now (projections are gray). Owner names under every team, “4 more rush yds”, “13 players left”, less empty space in the matchup header, and a DIV column (division record) in Standings.'],
  ['1.1.3', 'Player scores sit centered on the position square, with the projection underneath.'],
  ['1.1.2', 'Tab bar sits lower, closer to the bottom of the screen.'],
  ['1.1.1', 'Every game card shows each team\u2019s win % next to its name. Win % is less overconfident (calibrated against FantasyPros).'],
  ['1.1.0', 'The Prediction Engine: our backtested model projects every player, then 20,000 simulations per game give live win % (ties go to bench points) and update during games. New FantasyPros-style matchup header, League Analysis card with playoff odds (top 5 in your division), Divisional Week badge, Pick\u2019em-style pins, new tab icons. Return TDs now score 6 for the player too, past weeks use CBS\u2019s official points, and the app reopens where you left off.'],
  ['1.0.1', 'Players on IR no longer show a CBS mismatch flag (CBS doesn\u2019t score IR).'],
  ['1.0.0', 'First version. Live scoring in our league’s exact rules from ESPN, checked against CBS. All six matchups with pins and press-and-hold to reorder, swipeable matchup screen with tier bars, TD and fumble badges, and AFC/NFC standings. The Prediction Engine (projections and win %) comes in the next update.']
];
const WORKER = 'https://fgt-lineups.armycombatmedic21.workers.dev';
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const SEASON = 2026;

/* ---------- storage (Pick'em pattern: never throws, memory fallback) ---------- */
const hasLocal = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
const memStore = {};
function put(key, val){
  const k = 'fgt-' + key, s = JSON.stringify(val);
  if(hasLocal){ try{ localStorage.setItem(k, s); delete memStore[k]; return; }catch(e){} }
  memStore[k] = s;
}
function getLocal(key){
  const k = 'fgt-' + key;
  if(Object.prototype.hasOwnProperty.call(memStore, k)){ try{ return JSON.parse(memStore[k]); }catch(e){ return null; } }
  if(!hasLocal) return null;
  try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function drop(key){ try{ localStorage.removeItem('fgt-' + key); }catch(e){} delete memStore['fgt-' + key]; }

/* ---------- small helpers ---------- */
const $ = function(s, r){ return (r || document).querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function trim(s){ return String(s || '').trim(); }
function shortName(n){ const w = trim(n).split(/\s+/); return w.length < 2 ? trim(n) : w[0][0] + '. ' + w.slice(1).join(' '); }
function normName(n){
  return String(n || '').toLowerCase().replace(/[‘’'`.]/g, '').replace(/-/g, ' ')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, ' ').replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
}
function timeout(ms){ try{ if(typeof AbortController === 'function'){ const c = new AbortController(); setTimeout(function(){ c.abort(); }, ms); return c.signal; } }catch(e){} return undefined; }
function getJSON(url){
  return fetch(url, { cache: 'no-store', signal: timeout(15000) }).then(function(r){
    if(!r.ok){ const e = new Error('http ' + r.status); e.status = r.status; return r.json().catch(function(){ return null; }).then(function(j){ e.body = j; throw e; }); }
    return r.json();
  });
}
function ago(t){
  if(!t) return '—';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if(s < 60) return s + ' s ago';
  const m = Math.round(s / 60);
  return m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
}
function sameDay(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function kickText(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return sameDay(d, new Date()) ? t : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + t;
}

/* ---------- league facts ---------- */
const LEAGUE = { '1':'Oakland','2':'Green Bay','3':'Buffalo','4':'Detroit','5':'New England','6':'Miami','7':'Jacksonville','8':'Indianapolis','9':'Baltimore','10':'New York','11':'Dallas','12':'Pittsburgh' };
const CODE = { '1':'OAK','2':'GB','3':'BUF','4':'DET','5':'NE','6':'MIA','7':'JAX','8':'IND','9':'BAL','10':'NY','11':'DAL','12':'PIT' };
function teamCode(id, name){ return CODE[id] || String(name || '').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase(); }
// CBS (and old) NFL abbreviations -> ESPN's
const NFL_ALIAS = { JAC:'JAX', WAS:'WSH', LA:'LAR', STL:'LAR', OAK:'LV', LVR:'LV', SD:'LAC', ARZ:'ARI', GNB:'GB', KAN:'KC', NWE:'NE', NOR:'NO', SFO:'SF', TAM:'TB', HST:'HOU', BLT:'BAL', CLV:'CLE' };
function nflAb(a){ a = String(a || '').toUpperCase(); return NFL_ALIAS[a] || a; }
const SLOTS = ['QB', 'RB', 'WR', 'WR', 'FLEX', 'TE', 'K', 'DST'];
const POS_ORDER = { QB:0, RB:1, WR:2, TE:3, K:4, DST:5 };

/* ---------- league scoring (Drop 1 §2, exact) ---------- */
const SKILL = [[25,3],[50,6],[100,10],[150,12],[200,15]];
const PASS = [[75,3],[150,5],[226,7],[300,10],[350,12],[400,15]];
function tierPts(y, T){ let p = 0; for(let i = 0; i < T.length; i++) if(y >= T[i][0]) p = T[i][1]; return p; }
function nextTier(y, T){ let floor = 0; for(let i = 0; i < T.length; i++){ if(y < T[i][0]) return { at: T[i][0], gain: T[i][1] - tierPts(y, T), floor: floor }; floor = T[i][0]; } return null; }
function tdPts(len){ if(len == null) return 6; return len >= 60 ? 12 : len >= 50 ? 10 : len >= 40 ? 8 : 6; }
function fgPts(len){ if(len == null) return 3; return len >= 50 ? 5 : len >= 40 ? 4 : 3; }
function paPts(pa){ return pa <= 0 ? 15 : pa <= 7 ? 9 : pa <= 17 ? 6 : pa <= 24 ? 3 : pa <= 29 ? 0 : -3; }
function lensTxt(a){ return a.map(function(l){ return l == null ? '?' : l; }).join(' · ') + ' yd'; }

/* Turns one player's stat line into league points plus the pieces the drop-down shows.
   s = { py, ptd:[len], pint, ry, rcar, rtd:[len], cy, ctd:[len], fl, two, fg:[len], xp, dst:{pa,sk,int,fr,td,sf} } */
function scoreStats(pos, s){
  const out = { pts: 0, bars: [], lines: [] };
  if(!s) return out;
  const line = function(lab, em, v, cls){ out.pts += v; out.lines.push({ lab: lab, em: em, v: v, cls: cls || '' }); };
  if(pos === 'DST'){
    const d = s.dst || {};
    const pa = Math.max(0, Math.round(d.pa || 0));
    line('PTS ALLOWED', String(pa), paPts(pa));
    if(d.sk) line('SACKS', String(d.sk), d.sk);
    if(d.int) line('INT', String(d.int), d.int);
    if(d.fr) line('FUM REC', String(d.fr), d.fr);
    if(d.td) line('D/ST TD', String(d.td), 6 * d.td, 'td');
    if(d.sf) line('SAFETY', String(d.sf), 2 * d.sf);
    return out;
  }
  if(pos === 'K'){
    const fg = s.fg || [];
    if(fg.length) line('FG', lensTxt(fg), fg.reduce(function(a, l){ return a + fgPts(l); }, 0));
    if(s.xp) line('XP', String(s.xp), s.xp);
    if(!fg.length && !s.xp) line('FG', 'none yet', 0);
    return out;
  }
  const bar = function(k, y, T){ y = Math.round(y || 0); const v = tierPts(y, T); out.pts += v; out.bars.push({ k: k, y: y, T: T, v: v }); };
  if(pos === 'QB'){ bar('PASS', s.py, PASS); bar('RUSH', s.ry, SKILL); if(s.cy) bar('REC', s.cy, SKILL); }
  else {
    if((s.py || 0) >= 75) bar('PASS', s.py, PASS);
    if(pos === 'RB'){ bar('RUSH', s.ry, SKILL); bar('REC', s.cy, SKILL); }
    else { bar('REC', s.cy, SKILL); if(s.ry || s.rcar) bar('RUSH', s.ry, SKILL); }
  }
  const tds = function(lab, a){ if(a && a.length) line(lab, lensTxt(a), a.reduce(function(t, l){ return t + tdPts(l); }, 0), 'td'); };
  tds('PASS TD', s.ptd); tds('RUSH TD', s.rtd); tds('REC TD', s.ctd);
  if(s.ktd) line('RETURN TD', String(s.ktd), 6 * s.ktd, 'td');
  if(s.two) line('2PT', String(s.two), 2 * s.two, 'td');
  if(s.pint) line('INT', String(s.pint), -s.pint, 'neg');
  if(s.fl) line('FUM LOST', String(s.fl), -s.fl, 'neg');
  return out;
}

/* CBS's own stat string, e.g. "271 PaYd, 3 PaTD (47,4,8), 7 RuYd, RuTD (1)" or "12 PA, DFR".
   Used as the fallback when ESPN can't be matched, and for past weeks. */
function parseCbsStats(str, pos, started){
  const s = { py:0, ptd:[], pint:0, ry:0, rcar:0, rtd:[], cy:0, ctd:[], fl:0, two:0, ktd:0, fg:[], xp:0, dst:{ pa:0, sk:0, int:0, fr:0, td:0, sf:0 } };
  const raw = trim(str);
  if(!raw) return started ? s : null;
  raw.split(/,\s*(?![^()]*\))/).forEach(function(tok){
    const m = /^(-?\d+(?:\.\d+)?)?\s*([A-Za-z0-9]+)\s*(?:\(([^)]*)\))?$/.exec(trim(tok));
    if(!m) return;
    const has = m[1] != null, n = has ? parseFloat(m[1]) : 1, code = m[2].toUpperCase();
    const lens = m[3] ? m[3].split(',').map(function(x){ const v = parseInt(x, 10); return isFinite(v) ? v : null; }) : [];
    const list = function(){ const a = lens.slice(); const want = has ? n : Math.max(1, lens.length); while(a.length < want) a.push(null); return a; };
    switch(code){
      case 'PAYD': s.py = n; break;
      case 'PATD': s.ptd = list(); break;
      case 'PAINT': s.pint = n; break;
      case 'RUYD': s.ry = n; break;
      case 'RUTD': s.rtd = list(); break;
      case 'REYD': s.cy = n; break;
      case 'RETD': s.ctd = list(); break;
      case 'FL': s.fl = n; break;
      case 'KRTD': case 'PRTD': case 'FRTD': case 'RETD2': s.ktd += n; break;
      case 'FG': s.fg = list(); break;
      case 'XP': s.xp = n; break;
      case 'PA': s.dst.pa = n; break;
      case 'SACK': s.dst.sk = Math.round(n); break;
      case 'INT': s.dst.int = n; break;
      case 'DFR': case 'FR': s.dst.fr = n; break;
      case 'DTD': case 'DSTTD': case 'TD': s.dst.td = n; break;
      case 'SFTY': case 'SAF': case 'SAFETY': s.dst.sf = n; break;
      default:
        if(/2PT|TWOPT|PA2P|RU2P|RE2P/.test(code)) s.two += n;
    }
  });
  return s;
}

/* ---------- ESPN box score -> per-player stat lines ---------- */
function parseSummary(sm){
  const out = { teams: {}, final: false, at: Date.now() };
  const team = function(ab){ return out.teams[ab] || (out.teams[ab] = { ath: {}, sk: 0, int: 0, fl: 0, tsk: 0, tint: 0, tfl: 0, td: {}, fg: {}, dstTd: 0, sf: 0 }); };
  try{ out.final = /FINAL/i.test(sm.header.competitions[0].status.type.name); }catch(e){}
  const box = (sm && sm.boxscore) || {};
  (box.players || []).forEach(function(tp){
    const ab = tp.team && tp.team.abbreviation; if(!ab) return;
    const T = team(ab);
    (tp.statistics || []).forEach(function(b){
      const keys = b.keys || [];
      (b.athletes || []).forEach(function(a){
        const nm = a.athlete && a.athlete.displayName; if(!nm) return;
        const key = normName(nm);
        const A = T.ath[key] || (T.ath[key] = { name: nm });
        const st = a.stats || [];
        const g = function(n){ const i = keys.indexOf(n); return i < 0 ? '' : String(st[i] == null ? '' : st[i]); };
        if(b.name === 'passing'){
          A.py = num(g('passingYards')); A.ptdN = num(g('passingTouchdowns')); A.pint = num(g('interceptions'));
          const sk = parseInt(g('sacks-sackYardsLost'), 10) || 0; A.sk = sk; T.sk += sk; T.int += A.pint;
        }else if(b.name === 'rushing'){ A.ry = num(g('rushingYards')); A.rcar = num(g('rushingAttempts')); A.rtdN = num(g('rushingTouchdowns')); }
        else if(b.name === 'receiving'){ A.cy = num(g('receivingYards')); A.rec = num(g('receptions')); A.ctdN = num(g('receivingTouchdowns')); }
        else if(b.name === 'fumbles'){ A.fl = num(g('fumblesLost')); T.fl += A.fl; }
        else if(b.name === 'kicking'){
          A.fgm = parseInt(g('fieldGoalsMade/fieldGoalAttempts').split('/')[0], 10) || 0;
          A.xpm = parseInt(g('extraPointsMade/extraPointAttempts').split('/')[0], 10) || 0;
        }
      });
    });
  });
  (box.teams || []).forEach(function(t){
    const ab = t.team && t.team.abbreviation; if(!ab) return;

const busy = {};

function next6amET(t){
  const et = new Date(new Date(t).toLocaleString('en-US', { timeZone: 'America/New_York' })), off = t - et.getTime();
  const d = new Date(et.getTime()); if(d.getHours() >= 6) d.setDate(d.getDate() + 1); d.setHours(6, 0, 0, 0);

}

  if(Array.isArray(d)) d.forEach(function(x){ (x.teams || []).forEach(function(t){ if(num(t.wins) + num(t.losses) + num(t.ties) >= P) posted = true; }); });
  if(posted) return P + 1;
  if(sv && Date.now() >= next6amET(sv.at)) return P + 1;
  return P;
}
function applyWeek(){                             // set the app's current week (CBS period, or the next week after Tuesday 6 AM)
  const P = num(S.cbsPeriod); if(!P) return;
  const eff = effWeek(P), prevCur = S.curWeek;
  if(eff === prevCur && S.week) return;
  S.curWeek = eff; put('cur-week', eff);

  if(!S.week) S.week = eff;

}
function loadCbs(week){

      if(old && old.data !== j.data){ modelMemo.src = null; }
      if(w === S.curWeek) put('cbs-w' + w, { data: j.data, at: S.cbs[w].at });
    })

      if(!w){ S.bootErr = msg === 'cbs_key' ? 'the CBS key has expired' : msg; return; }
      const c = S.cbs[w] || (S.cbs[w] = {});

function loadSb(week){

    .then(function(data){

      const parsed = parseScoreboard(data);

// a box score is refetched when its game moves on (new play, score, clock) — at most every 8 s per game
let sumQueue = [], sumRunning = 0;
function gameKey(g){ return g.state + '|' + g.lp + '|' + JSON.stringify(g.scores) + '|' + g.period + '|' + g.clock + '|' + g.statusName; }
function queueSums(week){
  const sb = S.sb[week] && S.sb[week].parsed; if(!sb) return;
  const now = Date.now();
  Object.keys(sb.events).forEach(function(id){
    const g = sb.events[id];
    if(g.state === 'pre') return;
    let s = S.sums[id];
    if(!s){
      const saved = getLocal('sum-' + id);
      if(saved && saved.P && saved.P.final){ S.sums[id] = s = { P: saved.P, at: saved.at, key: gameKey(g), final: true }; }
    }
    if(s && (s.final || s.busy)) return;
    if(sumQueue.indexOf(id) >= 0) return;
    if(s && s.at){
      const age = now - s.at;
      if(age < 8000) return;                                                   // never more than every 8 s per game
      if(g.state === 'in' && s.key === gameKey(g) && age < 60000) return;      // nothing new happened (safety refetch each minute)
      if(g.state === 'post' && s.P && s.P.final){ s.final = true; return; }
      if(g.state === 'post' && age < 30000) return;                            // ESPN's box score can trail the final whistle
    }

}

    const key = g ? gameKey(g) : '';
    const s = S.sums[id] || (S.sums[id] = { at: 0 });
    s.busy = true; sumRunning++;
    getJSON(ESPN + '/summary?event=' + id)
      .then(function(sm){
        const P = parseSummary(sm);
        s.P = P; s.at = Date.now(); s.key = key; s.err = '';
        if(P.final && g && g.state === 'post'){ s.final = true; put('sum-' + id, { P: P, at: s.at, w: week }); }
      })
      .catch(function(){ s.err = 'espn'; s.at = Date.now(); })

}
function loadStandings(){

    .then(function(j){ if(!j || !j.ok || !j.data || !j.data.overall_standings) throw Object.assign(new Error('bad'), { code: (j && j.error) || 'bad' }); S.standings = j.data; S.standings._at = j.at || Date.now(); S.stAt = Date.now(); S.stErr = ''; put('standings', S.standings); })

/* ---------- automatic updates (v1.4.3): never ask, refresh once, say so ----------
   Every 20 s (and on open / coming back to the app) it reads version.txt (a few bytes, fresh address each time).
   When a newer version is out it downloads the new page first and checks it really is newer, then refreshes once

const UPD_T0 = Date.now(), UPD_START_DELAY = 3000;

  const ae = document.activeElement; if(ae && /TEXTAREA|INPUT/.test(ae.tagName) && ae.value) return true;   // typing a chat message

  if(sig === chatSig) return; chatSig = sig;
  const near = chatList.scrollHeight - chatList.scrollTop - chatList.clientHeight < 80;
  if(!list.length){ chatList.innerHTML = '<div class="chatempty">No messages yet. Say something to the league.</div>'; return; }
  let prev = null, day = '', h = '';
  list.forEach(function(m){
    const d = chatDay(m.t); if(d !== day){ day = d; prev = null; h += '<div class="chatsys">' + esc(d) + '</div>'; }
    const mine = m.pid === CH.pid, first = !(prev && prev.pid === m.pid); prev = m;
    const lab = esc(chatLabel(m)), col = m.team ? (TEAM_COLORS[m.team] || '#b99cff') : '#b99cff';
    const who = !first ? '' : mine ? '<span class="chatwho" style="color:var(--green)"><i>' + esc(chatTime(m.t)) + ' · </i>' + lab + '</span>'
      : '<span class="chatwho" style="color:' + col + '">' + lab + ' <i>· ' + esc(chatTime(m.t)) + '</i></span>';
    h += '<div class="chatmsg' + (mine ? ' mine' : '') + (first ? ' first' : '') + '">' + who + '<div class="chatbubble"' + (mine ? ' data-mid="' + esc(m.id) + '" role="button" tabindex="0" aria-label="Your message, tap for options"' : '') + '>' + esc(m.text) + '</div></div>';
  });
  chatList.innerHTML = h;
  if(!keepBottom || near) chatList.scrollTop = chatList.scrollHeight;
}
function lockPage(on){
  const H = document.documentElement, b = document.body.style;
  if(on === H.classList.contains('chatmode')) return;
  H.classList.toggle('chatmode', on);
  if(on){ window.scrollTo(0, 0); b.position = 'fixed'; b.top = '0'; b.left = '0'; b.right = '0'; b.width = '100%'; }
  else if(!openOverlays){ b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.width = ''; }
}
function fitPane(){
  if(pane.hidden) return;
  const vv = window.visualViewport;
  const bottom = vv ? Math.max(0, Math.round(window.innerHeight - (vv.height + vv.offsetTop))) : 0;
  pane.style.bottom = bottom + 'px';
  if(vv && vv.offsetTop) pane.style.transform = 'translateY(' + Math.round(vv.offsetTop) + 'px)'; else pane.style.transform = '';
}
if(window.visualViewport){ ['resize', 'scroll'].forEach(function(ev){ window.visualViewport.addEventListener(ev, function(){ fitPane(); if(document.activeElement === chatInput) chatList.scrollTop = chatList.scrollHeight; }); }); }
function placePane(){
  const on = S.view === 'chat';
  lockPage(on);
  if(pane.hidden === on){ pane.hidden = !on; if(on){ chatSig = ''; paintChat(false); } }
  if(!on) return;
  const v = $('#view'), r = v.getBoundingClientRect(), wrap = v.parentElement.getBoundingClientRect();
  pane.style.top = Math.max(0, Math.round(r.bottom + 2)) + 'px';
  pane.style.left = Math.round(wrap.left) + 'px'; pane.style.width = Math.round(wrap.width) + 'px';
  const has = !!S.team;
  $('#chatCompose').hidden = !has; $('#chatPick').hidden = has;
  fitPane();
}
function grow(){ chatInput.style.height = 'auto'; chatInput.style.height = Math.min(124, chatInput.scrollHeight) + 'px'; }
chatInput.addEventListener('input', grow);
chatInput.addEventListener('focus', function(){ document.documentElement.classList.add('chattyping'); });
chatInput.addEventListener('blur', function(){ setTimeout(function(){ document.documentElement.classList.remove('chattyping'); }, 120); });
chatInput.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });
chatSend.addEventListener('click', sendChat);
$('#chatPickBtn').addEventListener('click', function(){ openTeamSheet(false); });
function sendChat(){
  const text = chatInput.value.replace(/\s+$/, '').replace(/^\s+/, '').slice(0, 300);
  if(!text || !S.team || chatSend.disabled) return;
  chatSend.disabled = true;
  const body = { pid: CH.pid, name: chatLabel({ team: String(S.team) }).slice(0, 40) || 'Team', text: text, t: { '.sv': 'timestamp' }, team: String(S.team) };
  fetch(DB + '/fgt/chat/' + ROOM + '.json', { method: 'POST', body: JSON.stringify(body) })
    .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(j){ chatInput.value = ''; grow(); if(j && j.name && !CH.live.chat){ CH.lastPoll.chat = 0; poll('chat'); } })
    .catch(function(){ toast('Couldn’t send. Check your connection.'); })
    .then(function(){ chatSend.disabled = false; });
}
chatList.addEventListener('click', function(e){
  const b = e.target.closest('[data-mid]'); if(!b) return;
  CH.pending = b.dataset.mid; $('#chatDelText').textContent = b.textContent.length > 80 ? b.textContent.slice(0, 80) + '…' : b.textContent;
  openOverlay(delOv);
});
$('#chatDelYes').addEventListener('click', function(){
  const id = CH.pending; closeOverlay(delOv); if(!id) return;
  fetch(DB + '/fgt/chat/' + ROOM + '/' + encodeURIComponent(id) + '.json', { method: 'DELETE' })
    .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); CH.msgs = Object.assign({}, CH.msgs); delete CH.msgs[id]; paintChat(true); paintBadge(); toast('Message deleted'); })
    .catch(function(){ toast('Couldn’t delete that message'); });
});
window.addEventListener('resize', function(){ if(S.view === 'chat') placePane(); });
beat(true); openStream('pres'); openStream('chat'); setTimeout(function(){ poll('pres'); poll('chat'); }, 3000);
var chatHook = function(){ placePane(); paintBadge(); };
/* pinch-zoom off (iPhone Safari ignores user-scalable=no, so block the gesture itself) */
['gesturestart', 'gesturechange'].forEach(function(ev){ document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false }); });
document.addEventListener('touchmove', function(e){ if(e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

window.__fgt = { S: S, ENG: ENG, projFor: projFor, engState: engState, scoreStats: scoreStats, parseCbsStats: parseCbsStats, parseSummary: parseSummary, espnStats: espnStats, weekModel: weekModel, liveModel: liveModel, parseScoreboard: parseScoreboard, stAdjust: stAdjust, stCheck: function(){ return STCHECK; }, fmtPct: fmtPct, curW: function(){ return CURW; }, _setCurW: function(v){ CURW = v; stMemo.sig = ''; }, version: APP_VERSION };
try{ history.replaceState({}, ''); }catch(e){}
// reopen where you were (4 h); a week other than the current one only holds 10 minutes (Pick'em 4.5.5)
(function restoreView(){
  const lv = getLocal('view'); if(!lv || !S.team || Date.now() - lv.t > VIEW_MAX_AGE) return;
  const away = Date.now() - lv.t;
  if(lv.w && S.curWeek && lv.w !== S.curWeek){
    if(away < OFFWEEK_MAX){ S.week = lv.w; setTimeout(function(){ loadWeek(true); }, 0); }
    else setTimeout(function(){ toast('Back to Current Week \u00B7 Week ' + S.curWeek); }, 600);
  }
  if(['match', 'standings', 'chat'].indexOf(lv.v) >= 0){ S.view = lv.v; S.curKey = lv.k || null; try{ history.pushState({ v: lv.v }, ''); }catch(e){} if(lv.v === 'standings') loadStandings(); }
})();
render();
tick();
loadProj();
setTimeout(function(){ checkUpdate('wake'); }, UPD_START_DELAY);
if(!S.team){
  if(!isInstalled() && !getLocal('gate')){ gate.hidden = false; gateHome(false); }
  else openTeamSheet(true);
}
})();
</script>
