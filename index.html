<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<style>html,body{background:#060b16}</style>
<script>try{if(localStorage.getItem('fgt-gsm'))document.documentElement.className+=' gsm';}catch(e){}try{if(/Android/i.test(navigator.userAgent))document.documentElement.className+=' android';}catch(e){}</script>
<meta name="theme-color" content="#060b16">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link id="manifestLink" rel="manifest" href="manifest.json">
<link id="touchIcon" rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Tracker">
<meta name="mobile-web-app-capable" content="yes">
<title>Game Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"></noscript>
<style>
/* ===================== Fantasy Game Tracker =====================
   One file. Look = approved round 5 mock-up (Pick'em "premium glass", blue accent).
   Sections: tokens/base · header/status · scoreboard cards · matchup · standings ·
   sheets/overlays (Pick'em) · first-open gate (Pick'em) · tab bar (Pick'em Glass Pill) · motion */
:root{
  --bg:#060b16; --card:linear-gradient(180deg,#0e1829,#0b1321);
  --hair:rgba(147,174,200,.10); --hair2:rgba(147,174,200,.22);
  --acc:#4f8dff; --acc-rgb:79,141,255; --ink:#050f24;
  --gold:#f4c43d; --green:#3ddc84; --red:#ff3b4e; --amber:#ffb020;
  --text:#dce8f5; --muted:#93aec8; --faint:#6a84a0;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:contain}
body{background:var(--bg);background-image:linear-gradient(180deg,#0a1426 0,#060b16 260px);background-repeat:no-repeat;color:var(--text);font-family:var(--font);font-variant-numeric:tabular-nums;margin:0;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,.mc:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
img{display:block}

/* ---- header ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.kick{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--acc)}
h1{margin:3px 0 0;font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
.hbtns{display:flex;gap:8px}
.pill{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.04);font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.now{border-color:rgba(var(--acc-rgb),.7);color:var(--acc);box-shadow:0 0 14px rgba(var(--acc-rgb),.18)}
.gear{width:42px;height:42px;border-radius:50%;border:1px solid var(--hair2);background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.35}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:beacon 2s infinite;flex:none}
.dot.still{animation:none;background:var(--faint)}
.dot.bad{animation:none;background:var(--amber)}
@keyframes beacon{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.55)}70%{box-shadow:0 0 0 9px rgba(var(--acc-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),0)}}
.status b{color:var(--text);font-weight:800}
.status b.warn{color:var(--amber)}
.status.keyst{padding:9px 12px;margin:0 0 14px;font-size:12.5px}
/* v1.7.2: Online bar always drawn; gray dot = this phone is offline */
.onstrip .odot.off{background:#56607a;box-shadow:none;animation:none}
.onstrip .odot.off::after{display:none}
.onstrip span{min-height:22px}
.onstrip{min-height:43px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h2{margin:0;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.sec span{font-size:12px;color:var(--faint);font-weight:600;text-align:right}
.linkbtn{font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;margin:-6px 0}

.pick{width:100%;border-radius:18px;padding:20px;text-align:left;border:1.5px solid rgba(var(--acc-rgb),.75);background:linear-gradient(180deg,rgba(var(--acc-rgb),.10),rgba(var(--acc-rgb),.02));display:flex;align-items:center;gap:16px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 22px rgba(var(--acc-rgb),.35)}}
.pick .ic{width:50px;height:50px;border-radius:14px;background:var(--acc);color:var(--ink);display:grid;place-items:center;flex:none}
.pick strong{display:block;font-size:18px;font-weight:800;color:#fff}
.pick small{font-size:14px;color:var(--muted);font-weight:600}

/* ---- scoreboard cards ---- */
.mc{position:relative;border:1px solid var(--hair);background:var(--card);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 24px rgba(0,0,0,.42);padding:12px 16px 14px;margin-bottom:12px;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.mc.mine{border-color:rgba(var(--acc-rgb),.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(var(--acc-rgb),.12),0 10px 24px rgba(0,0,0,.42)}
.mchead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:26px}
.tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.mine .tag{color:var(--acc)}
.pin{width:34px;height:34px;margin:-6px 0 -6px -8px;display:grid;place-items:center;border-radius:9px;color:var(--faint);position:relative}
.pin::before{content:"";position:absolute;inset:-6px}
.pin[aria-pressed="true"]{color:var(--acc)}
.trow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;padding:6px 0}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--hair2);color:var(--text);overflow:hidden;flex:none}
.badge img{width:100%;height:100%;object-fit:cover}
.tn{min-width:0}
.tn b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn small{font-size:13px;color:var(--faint);font-weight:600}
.sc{text-align:right}
.sc b{display:block;font-size:25px;font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1.05}
.sc small{font-size:12px;color:var(--faint);font-weight:700}
.trow.lead .sc b{color:var(--green)}
.engine{text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin-top:6px}
.mc .engine{margin-top:8px;padding-top:9px;border-top:1px solid var(--hair)}

.mc.lg{padding:10px 14px 11px;margin-bottom:9px;border-radius:15px}
.mc.lg .mchead{position:absolute;top:7px;left:7px;margin:0;min-height:0;z-index:2}
.mc.lg .pin{margin:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);background:rgba(255,255,255,.04)}
.mc.lg .pin[aria-pressed="true"]{border-color:var(--acc);background:rgba(var(--acc-rgb),.18);box-shadow:0 0 10px rgba(var(--acc-rgb),.35)}
.mc.lg .rows{padding-left:0;padding-top:16px}
.mc.lg .trow{grid-template-columns:30px 1fr auto;gap:10px;padding:3px 0}
.mc.lg .badge{width:30px;height:30px;border-radius:8px;font-size:11px}
.mc.lg .tn b{font-size:17px;display:inline}
.mc.lg .tn small{font-size:13px;margin-left:6px}
.mc.lg .sc{display:flex;align-items:baseline;gap:8px}
.mc.lg .sc b{font-size:22px;order:2}
.mc.lg .sc small{font-size:12px;order:1}
.mc.lg .left{position:absolute;top:9px;right:14px;font-size:10px}

/* ---- matchup screen ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back{height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--hair2);color:var(--acc);font-weight:800;font-size:14px}
.mtitle{font-size:14px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#fff}
.hero{border:1px solid var(--hair);background:var(--card);border-radius:20px;padding:16px 14px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.hgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.hteam{display:flex;flex-direction:column;gap:6px;min-width:0}
.hteam.r{align-items:flex-end;text-align:right}
.hteam .badge{width:48px;height:48px;border-radius:15px;font-size:14px}
.hteam b{font-size:17px;font-weight:800;line-height:1.15}
.hteam small{font-size:13px;color:var(--faint);font-weight:600}
.hsc{display:grid;grid-template-columns:auto auto;gap:2px 18px;text-align:center}
.hsc b{font-size:34px;font-weight:800;letter-spacing:-1px;color:#fff;line-height:1.05}
.hsc b.lead{color:var(--green)}
.hsc em{grid-column:1/-1;font-style:normal;font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase;margin-top:4px}
.swipehint{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dots{display:flex;justify-content:center;gap:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots i.on{background:var(--acc)}
.arrow{width:44px;height:38px;border-radius:10px;color:var(--muted);font-size:22px;font-weight:800;display:grid;place-items:center}

.plist{margin-top:14px;border:1px solid var(--hair);background:#0b1321;border-radius:18px;overflow:hidden}
.plabel{padding:12px 14px 8px;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.prow{display:grid;grid-template-columns:1fr 52px 1fr;align-items:start;gap:6px;padding:12px;border-top:1px solid rgba(147,174,200,.08);width:100%;text-align:left}
.pside{min-width:0;display:flex;flex-direction:column;gap:3px}
.pside.r{align-items:flex-end;text-align:right}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.pside.r .ptop{flex-direction:row-reverse}
.nfl{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--hair);overflow:hidden}
.nfl img{width:24px;height:24px;object-fit:contain}
.ppt{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.pside.r .ppt{align-items:flex-start}
.ppt b{font-size:22px;font-weight:800;color:#fff;line-height:1.05}
.ppt b.zero{color:var(--faint)}
.ppt small{font-size:11px;font-weight:800;margin-top:3px;color:var(--faint)}
.ppt small.cbsx{color:var(--amber)}
.pnm{font-size:15px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;margin-top:4px}
.pnm small{font-size:12px;color:var(--faint);font-weight:700;margin-left:5px}
.pgm{font-size:12px;color:var(--faint);font-weight:600}
.pgm.live{color:var(--acc)} .pgm.fin{color:var(--muted)}
.mini{margin-top:5px;width:100%;max-width:140px}
.mini span{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:3px}
.mini span em{font-style:normal;color:#5cf29d;font-weight:800}
.pside.r .mini{align-self:flex-end}
.ctr{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.chev{width:30px;height:26px;border-radius:8px;border:1px solid var(--hair2);display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.prow[aria-expanded="true"] .chev{transform:rotate(180deg);color:#fff;border-color:rgba(255,255,255,.35)}
/* position squares */
.chip{justify-self:center;width:48px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;position:relative;
  --c:148,163,184;color:rgb(var(--c));border:1.5px solid rgba(var(--c),.85);background:linear-gradient(160deg,rgba(var(--c),.30),rgba(var(--c),.08) 60%,rgba(6,11,22,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 14px rgba(var(--c),.35);text-shadow:0 0 8px rgba(var(--c),.6);letter-spacing:.6px}
.chip.QB{--c:157,108,255}.chip.RB{--c:34,211,238}.chip.WR{--c:46,230,128}.chip.TE{--c:255,72,110}.chip.K{--c:255,145,40}.chip.DST{--c:176,190,208}
.chip.FLEX{color:#fff;border-color:transparent;background:linear-gradient(135deg,rgba(34,211,238,.9) 0 50%,rgba(46,230,128,.9) 50% 100%) border-box;box-shadow:0 0 14px rgba(40,220,180,.35);text-shadow:0 1px 2px rgba(0,0,0,.6);isolation:isolate}
.chip.FLEX::before{content:"";position:absolute;inset:1.5px;border-radius:7px;background:linear-gradient(135deg,rgba(13,40,52,.92) 0 50%,rgba(10,44,30,.92) 50% 100%);z-index:-1}
.prow.bench .chip{--c:106,132,160;color:var(--faint);border:1.5px dashed rgba(106,132,160,.6);background:rgba(255,255,255,.03);box-shadow:none;text-shadow:none}
/* tier bars */
.tb{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 4px}
.tb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(46,230,128,.35),#2ee680);box-shadow:0 0 10px rgba(46,230,128,.7)}
.tb.max i{background:linear-gradient(90deg,rgba(244,196,61,.4),var(--gold));box-shadow:0 0 10px rgba(244,196,61,.7)}
.mini .tb{height:5px;margin:0}
.gain{display:inline-block;padding:1px 6px;border-radius:7px;background:rgba(46,230,128,.14);border:1px solid rgba(46,230,128,.6);color:#5cf29d;font-weight:800;font-size:11px;box-shadow:0 0 10px rgba(46,230,128,.3);letter-spacing:.3px}
.gain.max{background:rgba(244,196,61,.14);border-color:rgba(244,196,61,.6);color:var(--gold);box-shadow:none}
/* condensed side-by-side drop-down */
.detail{display:grid;grid-template-columns:1fr 1fr;background:rgba(10,18,32,.95);border-top:1px solid rgba(147,174,200,.08)}
.dcol{padding:10px 12px 12px;display:flex;flex-direction:column;min-width:0}
.dcol+.dcol{border-left:1px solid rgba(147,174,200,.12)}
.grp{padding:6px 0;border-top:1px solid rgba(147,174,200,.10)}
.grp:first-child{border-top:0;padding-top:0}
.dl{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dl span{font-size:12px;font-weight:800;letter-spacing:.6px;color:#fff;min-width:0}
.dl em{font-style:normal;font-weight:600;letter-spacing:0;color:var(--muted)}
.pv{flex:none;min-width:34px;height:24px;padding:0 7px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--hair2)}
.pv.td{color:var(--gold)}
.pv.neg{color:var(--red)}
.pv.cbs{color:var(--amber)}
.dcol .tb{height:6px;margin:1px 0 0}
.dsub{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--faint);margin-top:3px;gap:6px}
.dtot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;padding-top:7px;border-top:1px solid rgba(147,174,200,.14)}
.dtot span{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.pv.total{height:30px;min-width:46px;font-size:17px;border:1.5px solid rgba(var(--acc-rgb),.85);background:rgba(var(--acc-rgb),.14);box-shadow:0 0 12px rgba(var(--acc-rgb),.3)}
.cbsl{color:var(--amber)!important}
/* event badge + score glow (pulse ~10 s, hold 3 min; score glows 60 s) */
.evt{align-self:flex-start;margin-top:3px;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:6px}
.evt.pulse{animation:evt 1.2s ease-in-out 8}
.pside.r .evt{align-self:flex-end}
.evt.td{color:#1b1300;background:var(--gold);box-shadow:0 0 12px rgba(244,196,61,.6)}
.evt.fum{color:#fff;background:var(--red);box-shadow:0 0 12px rgba(255,59,78,.6)}
@keyframes evt{50%{transform:scale(1.06);filter:brightness(1.25)}}
.ppt b.glow{color:#fff;text-shadow:0 0 14px rgba(var(--acc-rgb),.9);animation:sg 1.6s ease-in-out infinite}
@keyframes sg{50%{text-shadow:0 0 4px rgba(var(--acc-rgb),.4)}}
.empty{padding:24px 14px;text-align:center;color:var(--faint);font-size:14px;font-weight:600}
.note{margin-top:16px;font-size:12px;color:var(--faint);text-align:center;font-weight:600}
.soon{margin-top:30px;border:1px solid var(--hair);background:var(--card);border-radius:18px;padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:8px}
.soon b{font-size:20px;font-weight:800;color:#fff}.soon span{font-size:15px;color:var(--muted)}

/* ---- standings ---- */
.stcard{border:1px solid var(--hair);background:var(--card);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 24px rgba(0,0,0,.42);margin-bottom:14px;overflow:hidden}
.sthead,.strow{display:grid;grid-template-columns:18px 30px 1fr 44px 34px 40px;align-items:center;gap:8px;padding:0 14px}
.sthead{height:40px;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--hair)}
.sthead b{grid-column:1/4;font-size:13px;letter-spacing:1.8px;color:var(--acc)}
.sthead span,.strow .stwl,.strow .stgb,.strow .stk{text-align:right}
.strow{width:100%;min-height:52px;text-align:left;border-top:1px solid rgba(147,174,200,.07)}
.strow:first-of-type{border-top:0}
.strow .rk{font-size:12px;font-weight:800;color:var(--faint);text-align:center}
.strow .badge{width:30px;height:30px;border-radius:8px;font-size:10px}
.strow .stn{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strow .stwl{font-size:15px;font-weight:800;color:#fff}
.strow .stgb{font-size:13px;font-weight:700;color:var(--muted)}
.strow .stk{font-size:12px;font-weight:800;color:var(--muted)}
.strow .stk.w{color:var(--green)} .strow .stk.l{color:var(--red)}
.strow.me{background:linear-gradient(90deg,rgba(var(--acc-rgb),.20),rgba(var(--acc-rgb),.05) 70%,rgba(var(--acc-rgb),.02));box-shadow:inset 3px 0 0 var(--acc)}
.strow.me .stn{color:#fff}.strow.me .rk{color:var(--acc)}
.stdet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 14px 14px 70px}
.stdet div{display:flex;flex-direction:column;gap:2px}
.stdet small{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.stdet b{font-size:16px;font-weight:800;color:#fff}

/* ---- sheets (Pick'em) ---- */
.overlay{position:fixed;inset:0;overscroll-behavior:contain;background:rgba(2,5,12,.66);display:flex;align-items:flex-end;justify-content:center;z-index:60;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .26s ease,visibility 0s linear .34s}
.overlay.show{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .26s ease,visibility 0s linear 0s}
.sheet,.confirmcard{position:relative;width:100%;max-width:480px;background:linear-gradient(180deg,#111e33,#0b1321 60%);border-top:1px solid rgba(147,174,200,.16);border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.55);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}

/* ---- v1.6.0: position pills, projection under the score (in the flow, never on the name), IR section, matchup header ---- */
/* center square moved up: logo, center square and score share one center line; projection sits right under the score.
   Rows end up 2px shorter than v1.5.6 (checked with Manrope on iPhone, S23 Ultra, 360 and 375 widths). */
.prow{padding:6px 10px 8px}
.ctr{padding-top:0}

.ptop .ppos{flex:none;align-self:flex-start;margin:16px auto 0 5px;display:inline-grid;place-items:center;height:16px;min-width:24px;padding:0 5px;border-radius:999px;box-sizing:border-box;
  font-size:9.5px;font-weight:800;letter-spacing:.2px;line-height:1;background:#0b1321;border:1px solid rgba(var(--c),.85);color:rgb(var(--c));box-shadow:0 0 5px rgba(var(--c),.18);text-shadow:0 0 3px rgba(var(--c),.3)}
.pside.r .ptop .ppos{margin:16px 5px 0 auto}
.ppos{--c:176,190,208}.ppos.QB{--c:157,108,255}.ppos.RB{--c:34,211,238}.ppos.WR{--c:46,230,128}.ppos.TE{--c:255,72,110}.ppos.K{--c:255,145,40}.ppos.DST{--c:176,190,208}
.benchlist .prow.bench .chip.irchip{border:1.5px solid rgba(255,84,104,.85);color:#ff8a98;background:#1f1a2e;box-shadow:0 0 6px rgba(255,84,104,.18)}
.irlist{margin-top:12px}
.pside.irempty{justify-content:flex-start}
.prow.none .chev{display:none}
.pside.irempty span{font-size:14px;font-weight:700;color:var(--faint);font-style:italic;line-height:32px}   /* on the IR square's line */

/* ---- v1.8.1: card border like the Online strip (thin blue line + faint blue fill, no glow); "My matchup" diamond on your game; star dot ---- */
.plist{border:1px solid rgba(var(--acc-rgb),.28)}
.hero,.hero.dw,.plist:not(.benchlist){border:1px solid rgba(var(--acc-rgb),.28);background:linear-gradient(180deg,rgba(var(--acc-rgb),.075),rgba(var(--acc-rgb),.035)),linear-gradient(180deg,#0e1829,#0b1321);box-shadow:none}

/* ---- v1.9.0 (Wes, Nov 12) ---- */

.bnr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:40px;padding:10px 12px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(147,174,200,.12)}

.pills{display:flex;align-items:center;gap:2px;margin-top:4px;width:100%;min-width:0}

.ck .dot{width:5.5px;height:5.5px;border-radius:50%;background:var(--green);flex:none}

.prow > .lvf{position:absolute;z-index:1;top:3px;bottom:3px;pointer-events:none;display:block}

.bn{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:13px}

/* ===== v1.27.0 (Wes, Nov 22): loading animations =====
   A shimmer      = a number whose spot is known (projections, odds, draft #)  -> gray glass bar with a light sweep
   B sweep bar    = win probability bars                                         -> the bar's own track, a blue glow sliding across
   C progress ring= the big season sim (Playoff Engine)                          -> real % from the worker (it reports every 1,000 seasons)
   D spinner pill = rows that finish one by one (TANK / DON'T TANK)              -> each pill spins until its own result lands
   E refresh      = re-running numbers you can already see (Win / Live / Loss)   -> old numbers stay, dimmed, with a sweep; spinner on the button you tapped

<script>
(function(){
'use strict';
/* =====================================================================
   Fantasy Game Tracker — v1.1 (Prediction Engine)
   Data:  CBS lineups/standings via our Cloudflare Worker (fgt-lineups, 1 call/min to CBS)
          ESPN scoreboard (10 s while live) + per-game box scores (refetched when a new play happens)
   Score: our league's exact rules (Drop 1 §2), computed from ESPN; CBS fpts is the cross-check.
   ===================================================================== */
const APP_VERSION = '1.30.0';
const OWNERS = { '1': 'Darrell Hill', '2': 'Derek Sandstrom', '3': 'Mike Amarose', '4': 'Michael Hester', '5': 'Perry Holmes', '6': 'Donald Burse', '7': 'Mike Burse', '8': 'Dale LaPointe', '9': 'Mark Lamb', '10': 'Jason Bendickson', '11': 'Rick L. & Wes S.', '12': 'Brett LaLonde' };   // read once from CBS (Nov 8, 2026); edit here if an owner changes
function ownerOf(t){ return t ? (OWNERS[String(t.id)] || '') : ''; }
const CHANGELOG = [
  ['1.30.0', 'When CBS lists a player as injured (Q, D, O, IR or suspended), his Matchup drop-down now shows the INJURY box during and after his game too, not just before kickoff. It also shows CBS\u2019s latest news headline about him, and the expected return week when CBS has one. Players in your IR slot now show their projection like bench players (their points still don\u2019t count toward your score or bench total).'],
  ['1.29.0', 'Every Scoreboard game now has a \u201cplayers left\u201d pill on its top edge that counts down as players finish and turns into FINAL with a green check. Win odds show >99.9% / <0.1% until a game is really over (100% only once nobody is left). On the Matchup screen each team has its own \u201cleft\u201d count on the Starters bar, and a FINAL badge sits above the VS once the game is over. The Schedule shows the W or L, the score and 100% as soon as that game is done. Playoff odds now count a player coming back from injured reserve from the week CBS lists as his expected return.'],
  ['1.28.2', 'RED ZONE only shows when the team with the ball is actually inside the other team\u2019s 20. ESPN sometimes left the red-zone flag on after a drive ended.'],
  ['1.28.1', 'The Schedule now fills the whole screen on iPhone. On narrower phones, team and owner names fit without being cut off.'],
  ['1.28.0', 'New Schedule page. Tap Schedule on the Scoreboard (next to League Analysis) or on Standings (next to Playoff Engine) and your season slides up: every week\u2019s opponent with their logo and owner, the score with a green W or red L, and your record after each week. This week shows the live score (or the projection before kickoff) and your win %. Week 12 is position night, so it shows who you\u2019ll most likely face and the odds. Pick any team at the top right; it always opens on your team. Visual changes: Schedule button on the Scoreboard and Standings (the Playoff Engine button is now half width).'],
  ['1.27.0', 'Loading animations everywhere the app makes you wait. Win odds, projections, playoff %, draft picks and the Playoff Engine show a moving shimmer or a sweeping bar instead of going blank, then the numbers pop in. The Playoff Engine shows a progress ring with the real % of the season sim. Chat shows gray message bubbles until it loads. Visual changes: loading states on Scoreboard, Matchup, Standings, Playoff Engine and Chat.'],
  ['1.26.0', 'Android: the league game cards on the Scoreboard are shorter and don’t wrap anymore. Team and win % on top, record and owner underneath, and the players-left count is gone.'],
  ['1.25.0', 'Bigger, easier-to-read player drop-downs: bigger point boxes with the yards (or distance) right under each one, three to a row for yards and points allowed, one row for touchdowns and field goals, and bigger text throughout.'],
  ['1.24.0', 'Cards go closer to the edges of the screen, so everything is a little wider. Grandpa Safe Mode: shorter game cards with no wrapping (team and win % on top, record and owner underneath), bigger bucket boxes in the player drop-down, and no text highlighting on a long press.'],
  ['1.23.0', 'Grandpa Safe Mode: a simpler, tap-proof version of the app for one phone. Turn it on in Settings with its own code. While it’s on, the Settings gear has a red X and does nothing on a tap (hold it 5 seconds to turn Safe Mode off with the code), there’s no Online card or Chat tab, the tab bar is bigger and solid black, the week always shows the current week, there are no pins, Indianapolis’s game sits right after your own, and the matchup projections show in gray. Phones without Safe Mode don’t change.'],
  ['1.22.0', 'Small behind-the-scenes improvements to the Playoff Engine.'],
  ['1.21.4', 'Playoff Engine: one consistent end-of-season picture. Projected seeds, the records next to them, each team’s Proj. seed at the top and the Draft # (here and in Standings) all come from the same most likely finish across all the simulated seasons, so they always agree with each other. The odds (playoffs, bye, title, each team’s seed %) are still each team’s own chances. Current records are marked “now”. Visual changes: “Likely seed” reads “Proj. seed”; the seeds card says “most likely finish”; records next to the team name say “now”.'],
  ['1.21.3', 'Projected seeds now show the most common final standings across all the simulated seasons — the whole division as it most often ends up, not each team sorted by its average seed. Each team’s % is still its own odds of the seed it’s listed at, and it updates live. The Playoff Engine page is shorter: Projected seeds now go straight to All teams.'],
  ['1.21.2', 'Playoff Engine fixes: (1) the bracket now reads like a real bracket — the winner of each box (its higher % = chance to win that game) moves on to the next round and the Super Bowl. Before, a team could lose a box and still show up in the next round. (2) Projected seeds show each team’s most likely final record (before, a rounded average: 5.4 wins showed as 5-7 when 6-6 was more likely). (3) The top section’s seed box is now “Likely seed”: the selected team’s own most likely seed and its odds. (4) New projections show up within about 2 minutes of each run (the app checks a tiny file every 2 minutes and only downloads the projections when they changed). Visual changes: “Proj. seed” label now reads “Likely seed”; bracket and record numbers may differ from before.'],
  ['1.21.1', 'More accurate playoff odds, bracket and draft odds: the weeks still to come (Week 12 through the Super Bowl) now use ESPN’s and Sleeper’s projections for each of those weeks, scored with our league’s rules, so injuries, byes and matchups they know about count. Before, every future week used one fixed number from our own model. Game ranges for future weeks are also a little tighter (they were wider than any team’s real week-to-week swings). No visual changes.'],
  ['1.21.0', 'Playoff Prediction Engine redesign. The page now uses every team’s best healthy lineup (players whose game has started keep their real CBS spot and points), so it updates live as scores come in. New top section: your team banner, Title chance with Reach Super Bowl, a Draft pick card with your 4 most likely picks and the average pick, and Playoffs / Bye / Proj. seed / Loser Bowl. Road to the title, Projected seeds (one card, both divisions, color seed dots: green bye, blue wild card, orange Loser Bowl) and All teams are cleaner. The bracket (marked Projected, like the Loser Bowl) is one card that meets at a gold Super Bowl in the middle, with logos, byes shown by name, and every % = the chance to win that game. All teams and the Standings DRAFT # column now show the projected draft order (each team gets its own #1–#12; your own pick odds stay on Home and in the team drop-down). Live players’ moving outline on Matchup is about 10% brighter, and the Super Bowl card has the same moving light in gold. Visual changes: the whole Playoff Engine page; bigger Standings button and team chip on that page; brighter live-player outline.'],
  ['1.20.0', 'Draft order fixed to the league rule: the two 1st-place teams pick 11–12, the two 2nd-place teams pick 9–10, the 3rd–5th place teams pick 3–8 by record, the Loser Bowl decides 1–2. Ties: same division = division record then points; different divisions = points. Before, 2nd-place teams were mixed into picks 3–10 by record. Draft odds update. No visual changes.'],
  ['1.19.0', 'Playoff Prediction Engine: the projected bracket now comes from the simulations — each spot shows the team that gets there most often. Before, every game just advanced the team with the higher projection, even by a tenth of a point (that put Green Bay in the Super Bowl while Indianapolis gets there far more often).'],
  ['1.18.0', 'Playoff Prediction Engine: new team drop-down (top right) with each team’s logo and name (YOU tag on your team); the team you’re looking at is highlighted.'],
  ['1.17.0', 'Matchup: new Current | Optimal switch under each team, like FantasyPros. It always starts on Current. Optimal puts that team’s best healthy lineup in (by our projections; players whose game has started stay where CBS has them; Out / IR / bye players never start): the bench player moves up into the starter row, the starter moves down to the bench, and the projected score and win % update.'],
  ['1.16.1', 'Fix: playoff odds, draft odds and the Playoff Prediction Engine assume every team plays its best healthy lineup this week again. Early in the week (bye-week players still in lineups) the lineups set in CBS made some games lopsided. Scoreboard and Matchup win % still use the real CBS lineups. No visual changes.'],
  ['1.16.0', 'Playoff Prediction Engine: new button on Standings opens a new page. The engine now plays the whole playoffs in every simulated season (Week 13 Loser Bowl, Week 14 wild card 4 vs 5, re-seeded Week 15 semis, Week 16 division final, Week 17 Super Bowl). The page shows title chance, draft pick, playoffs / bye / projected seed / Loser Bowl, the road to the title, projected seeds, the projected bracket and every team’s odds. A team drop-down (top right) shows any team without changing yours. The Loser Bowl is a real game in the draft odds (was 50/50).'],
  ['1.15.0', 'Draft pick projections: each simulated season now also works out the draft order (playoffs don’t matter). New on screen: a 4th Home box “Draft Pick” with the most likely pick and its odds; a DRAFT # column after PLAYOFF % in Standings; in a team’s drop-down, “Proj. Draft Pick” (most likely pick in the middle with the pick above and below and their odds) replaces Differential.'],
  ['1.13.0', 'TOUCHDOWN pill fixed: it now shows for 3 minutes from the moment the touchdown actually happened (ESPN’s play time), not from when your phone first noticed it. Before, if the app was in the background or your phone was locked when a TD was scored, coming back gave it a fresh 3 minutes (Goff’s TD at 10:15 was still showing at 10:38). Opening the app a minute after a TD still shows the pill for the rest of the 3 minutes. Look change: the red injury letters (Q, D, O, IR, SUS) now pulse only down to 75% brightness instead of 50%, so they stay easier to read. Nothing else looks different.'],
  ['1.12.0', 'New home-screen icon: a gold football with a blue live pulse line through it, and FANTASY in white italic letters with a blue underline across the top (replaces the old blue “GT”). The app’s name is unchanged. The app now uses a real install file (manifest) with proper PNG icons, so Android Chrome can install it as a real app, which should remove the little Chrome logo from the icon. To see the new icon: iPhone — delete the old icon, then in Safari tap Share → Add to Home Screen. Android — remove the old icon, then in Chrome tap ⋮ → Install app. Your saved team and settings are not affected. Nothing inside the app looks different.'],
  ['1.11.0', 'Injury letters from CBS: a bold red letter now shows next to a player, just like on CBS: Q (questionable), D (doubtful), O (out), IR (injured reserve), SUS (suspended). It slowly fades in and out. On the left team it sits after the NFL team, on the right team before the name. When CBS lists a player Out (or IR / suspended) for this week, his projection drops to 0, the win % is redone right away, and his name, team and logo are dimmed (the letter stays bright). This updates within about a minute or two of CBS posting it, instead of waiting for the next projections run. Tap a player before kickoff to see an INJURY note (what\u2019s hurt, CBS\u2019s status and expected return). The old \u201c% to play\u201d line is gone. If a long name plus the letter doesn\u2019t fit, the name is shortened with \u201c\u2026\u201d. Projections also refresh more often now (after injury reports Wed\u2013Fri, three times Saturday, and after the inactive lists on game days).'],
  ['1.10.1', 'Tap-open breakdown: touchdown and field-goal distances now read “1 yd, 31 yd” (each with its own yd; no Pass/Rush label, since every TD is scored by its distance). On a big day the list wraps to a second line instead of being cut off.'],
  ['1.10.0', 'Live players: a thin outline in the player’s position color (purple QB, cyan RB, green WR, pink TE, orange K, silver D/ST) now goes around a player’s half of the row while his game is on, with a soft band of light that slowly travels around it. The position square and the arrow sit on top of the outline. Starters get the moving light, bench players get the outline only, and the outline turns off while a row is opened. Tapping a row now shows every scoring bucket: for yards, a row of cells with the points each bucket pays (the bucket he’s in is lit, the next one fills as yards come in); every touchdown and field goal in its distance bucket; and the D/ST points-allowed buckets. The small “more yards” bar under a player hides while his row is open, since the breakdown shows it. While a matchup still has players left, finished players’ names and logos are slightly dimmed so the live ones stand out (their points stay bright).'],
  ['1.9.0', 'Player rows: the game clock is now a small pill with a green dot and white time (no game score). Before kickoff it shows the start time and opponent, and after the game it says “Final”. When a player’s team has the ball inside the 20, a red RED ZONE pill shows next to the clock; after a touchdown a gold TOUCHDOWN pill shows there for 3 minutes (it shortens to RZ / TD if a phone is too narrow). Team scores show “–” until a starter in that matchup kicks off, then both teams switch to their scores together; until then the player projections are bright, then they fade to gray. Card colors you picked: starters card solid dark (no shading), bench and IR cards solid, top matchup card a bit darker with less blue shading, softer color inside the position pills. Your scoreboard card has the “My matchup” diamond and the same border. Card titles are bigger and centered; the Bench title shows each team’s bench total and says “Tiebreaker only”.'],
  ['1.8.1', 'Your game is easy to find: it says “My matchup” in a diamond on the top edge of the matchup card, and its dot is a star, so you can swipe back to it fast. It follows whichever team you picked. The matchup and player cards have a cleaner blue border (no glow), and the badge now says “Division Week”.'],
  ['1.8.0', 'New Prediction Engine: every player\u2019s projection is now the average of the projected stats from CBS, Sleeper, ESPN and FantasyPros (when they have him), scored in our league\u2019s exact rules, for every spot including kickers (FGs by distance) and defenses (points allowed, sacks, INTs, fumble recoveries, TDs). Fumbles lost now count in projections. Our old model is only used when fewer than 2 sites project a player.'],
  ['1.7.2', 'Smoother open: team and NFL logos are kept on your phone, so they show instantly instead of blinking in. The Online bar is always there (nothing jumps down), and your own team shows in it right away.'],
  ['1.7.1', 'The “CBS key expired” warning now shows on every tab (Matchup, Standings and Chat too), right under the Online row.'],
  ['1.7.0', 'Opens instantly: the last lineups, projections, win % and playoff odds show right away and update within seconds. Playoff odds keep working when CBS can’t be reached (the rest of the schedule is saved). The Matchup tab goes back to your game, at the top, after 10 minutes away.'],

const WORKER = 'https://fgt-lineups.armycombatmedic21.workers.dev';
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const SEASON = 2026;

/* ---------- storage (Pick'em pattern: never throws, memory fallback) ---------- */
const hasLocal = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
const memStore = {};
function put(key, val){
  const k = 'fgt-' + key, s = JSON.stringify(val);
  if(hasLocal){ try{ localStorage.setItem(k, s); delete memStore[k]; return; }catch(e){} }
  memStore[k] = s;
}
function getLocal(key){
  const k = 'fgt-' + key;
  if(Object.prototype.hasOwnProperty.call(memStore, k)){ try{ return JSON.parse(memStore[k]); }catch(e){ return null; } }
  if(!hasLocal) return null;
  try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function drop(key){ try{ localStorage.removeItem('fgt-' + key); }catch(e){} delete memStore['fgt-' + key]; }

/* ---------- small helpers ---------- */
const $ = function(s, r){ return (r || document).querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function trim(s){ return String(s || '').trim(); }
function shortName(n){ const w = trim(n).split(/\s+/); return w.length < 2 ? trim(n) : w[0][0] + '. ' + w.slice(1).join(' '); }
function normName(n){
  return String(n || '').toLowerCase().replace(/[‘’'`.]/g, '').replace(/-/g, ' ')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, ' ').replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
}
function timeout(ms){ try{ if(typeof AbortController === 'function'){ const c = new AbortController(); setTimeout(function(){ c.abort(); }, ms); return c.signal; } }catch(e){} return undefined; }
function getJSON(url){
  return fetch(url, { cache: 'no-store', signal: timeout(15000) }).then(function(r){
    if(!r.ok){ const e = new Error('http ' + r.status); e.status = r.status; return r.json().catch(function(){ return null; }).then(function(j){ e.body = j; throw e; }); }
    return r.json();
  });
}
function ago(t){
  if(!t) return '—';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if(s < 60) return s + ' s ago';
  const m = Math.round(s / 60);
  return m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
}
function sameDay(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function kickText(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return sameDay(d, new Date()) ? t : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + t;
}

/* ---------- league facts ---------- */
const LEAGUE = { '1':'Oakland','2':'Green Bay','3':'Buffalo','4':'Detroit','5':'New England','6':'Miami','7':'Jacksonville','8':'Indianapolis','9':'Baltimore','10':'New York','11':'Dallas','12':'Pittsburgh' };
const CODE = { '1':'OAK','2':'GB','3':'BUF','4':'DET','5':'NE','6':'MIA','7':'JAX','8':'IND','9':'BAL','10':'NY','11':'DAL','12':'PIT' };
function teamCode(id, name){ return CODE[id] || String(name || '').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase(); }
// CBS (and old) NFL abbreviations -> ESPN's
const NFL_ALIAS = { JAC:'JAX', WAS:'WSH', LA:'LAR', STL:'LAR', OAK:'LV', LVR:'LV', SD:'LAC', ARZ:'ARI', GNB:'GB', KAN:'KC', NWE:'NE', NOR:'NO', SFO:'SF', TAM:'TB', HST:'HOU', BLT:'BAL', CLV:'CLE' };
function nflAb(a){ a = String(a || '').toUpperCase(); return NFL_ALIAS[a] || a; }
const SLOTS = ['QB', 'RB', 'WR', 'WR', 'FLEX', 'TE', 'K', 'DST'];
const POS_ORDER = { QB:0, RB:1, WR:2, TE:3, K:4, DST:5 };

/* ---------- league scoring (Drop 1 §2, exact) ---------- */
const SKILL = [[25,3],[50,6],[100,10],[150,12],[200,15]];
const PASS = [[75,3],[150,5],[226,7],[300,10],[350,12],[400,15]];
function tierPts(y, T){ let p = 0; for(let i = 0; i < T.length; i++) if(y >= T[i][0]) p = T[i][1]; return p; }
function nextTier(y, T){ let floor = 0; for(let i = 0; i < T.length; i++){ if(y < T[i][0]) return { at: T[i][0], gain: T[i][1] - tierPts(y, T), floor: floor }; floor = T[i][0]; } return null; }
function tdPts(len){ if(len == null) return 6; return len >= 60 ? 12 : len >= 50 ? 10 : len >= 40 ? 8 : 6; }
function fgPts(len){ if(len == null) return 3; return len >= 50 ? 5 : len >= 40 ? 4 : 3; }
function paPts(pa){ return pa <= 0 ? 15 : pa <= 7 ? 9 : pa <= 17 ? 6 : pa <= 24 ? 3 : pa <= 29 ? 0 : -3; }
function lensTxt(a){ return a.map(function(l){ return l == null ? '?' : l; }).join(' · ') + ' yd'; }

/* Turns one player's stat line into league points plus the pieces the drop-down shows.
   s = { py, ptd:[len], pint, ry, rcar, rtd:[len], cy, ctd:[len], fl, two, fg:[len], xp, dst:{pa,sk,int,fr,td,sf} } */
function scoreStats(pos, s){
  const out = { pts: 0, bars: [], lines: [] };
  if(!s) return out;
  const line = function(lab, em, v, cls){ out.pts += v; out.lines.push({ lab: lab, em: em, v: v, cls: cls || '' }); };
  if(pos === 'DST'){
    const d = s.dst || {};
    const pa = Math.max(0, Math.round(d.pa || 0));
    line('PTS ALLOWED', String(pa), paPts(pa));
    if(d.sk) line('SACKS', String(d.sk), d.sk);
    if(d.int) line('INT', String(d.int), d.int);
    if(d.fr) line('FUM REC', String(d.fr), d.fr);
    if(d.td) line('D/ST TD', String(d.td), 6 * d.td, 'td');
    if(d.sf) line('SAFETY', String(d.sf), 2 * d.sf);
    return out;
  }
  if(pos === 'K'){
    const fg = s.fg || [];
    if(fg.length) line('FG', lensTxt(fg), fg.reduce(function(a, l){ return a + fgPts(l); }, 0));
    if(s.xp) line('XP', String(s.xp), s.xp);
    if(!fg.length && !s.xp) line('FG', 'none yet', 0);
    return out;
  }
  const bar = function(k, y, T){ y = Math.round(y || 0); const v = tierPts(y, T); out.pts += v; out.bars.push({ k: k, y: y, T: T, v: v }); };
  if(pos === 'QB'){ bar('PASS', s.py, PASS); bar('RUSH', s.ry, SKILL); if(s.cy) bar('REC', s.cy, SKILL); }
  else {
    if((s.py || 0) >= 75) bar('PASS', s.py, PASS);
    if(pos === 'RB'){ bar('RUSH', s.ry, SKILL); bar('REC', s.cy, SKILL); }
    else { bar('REC', s.cy, SKILL); if(s.ry || s.rcar) bar('RUSH', s.ry, SKILL); }
  }
  const tds = function(lab, a){ if(a && a.length) line(lab, lensTxt(a), a.reduce(function(t, l){ return t + tdPts(l); }, 0), 'td'); };
  tds('PASS TD', s.ptd); tds('RUSH TD', s.rtd); tds('REC TD', s.ctd);
  if(s.ktd) line('RETURN TD', String(s.ktd), 6 * s.ktd, 'td');
  if(s.two) line('2PT', String(s.two), 2 * s.two, 'td');
  if(s.pint) line('INT', String(s.pint), -s.pint, 'neg');
  if(s.fl) line('FUM LOST', String(s.fl), -s.fl, 'neg');
  return out;
}

/* CBS's own stat string, e.g. "271 PaYd, 3 PaTD (47,4,8), 7 RuYd, RuTD (1)" or "12 PA, DFR".
   Used as the fallback when ESPN can't be matched, and for past weeks. */
function parseCbsStats(str, pos, started){
  const s = { py:0, ptd:[], pint:0, ry:0, rcar:0, rtd:[], cy:0, ctd:[], fl:0, two:0, ktd:0, fg:[], xp:0, dst:{ pa:0, sk:0, int:0, fr:0, td:0, sf:0 } };
  const raw = trim(str);
  if(!raw) return started ? s : null;
  raw.split(/,\s*(?![^()]*\))/).forEach(function(tok){
    const m = /^(-?\d+(?:\.\d+)?)?\s*([A-Za-z0-9]+)\s*(?:\(([^)]*)\))?$/.exec(trim(tok));
    if(!m) return;
    const has = m[1] != null, n = has ? parseFloat(m[1]) : 1, code = m[2].toUpperCase();
    const lens = m[3] ? m[3].split(',').map(function(x){ const v = parseInt(x, 10); return isFinite(v) ? v : null; }) : [];
    const list = function(){ const a = lens.slice(); const want = has ? n : Math.max(1, lens.length); while(a.length < want) a.push(null); return a; };
    switch(code){
      case 'PAYD': s.py = n; break;
      case 'PATD': s.ptd = list(); break;
      case 'PAINT': s.pint = n; break;
      case 'RUYD': s.ry = n; break;
      case 'RUTD': s.rtd = list(); break;
      case 'REYD': s.cy = n; break;
      case 'RETD': s.ctd = list(); break;
      case 'FL': s.fl = n; break;
      case 'KRTD': case 'PRTD': case 'FRTD': case 'RETD2': s.ktd += n; break;
      case 'FG': s.fg = list(); break;
      case 'XP': s.xp = n; break;
      case 'PA': s.dst.pa = n; break;
      case 'SACK': s.dst.sk = Math.round(n); break;
      case 'INT': s.dst.int = n; break;
      case 'DFR': case 'FR': s.dst.fr = n; break;
      case 'DTD': case 'DSTTD': case 'TD': s.dst.td = n; break;
      case 'SFTY': case 'SAF': case 'SAFETY': s.dst.sf = n; break;
      default:
        if(/2PT|TWOPT|PA2P|RU2P|RE2P/.test(code)) s.two += n;
    }
  });
  return s;
}

/* ---------- ESPN box score -> per-player stat lines ---------- */
function parseSummary(sm){
  const out = { teams: {}, final: false, at: Date.now() };
  const team = function(ab){ return out.teams[ab] || (out.teams[ab] = { ath: {}, sk: 0, int: 0, fl: 0, tsk: 0, tint: 0, tfl: 0, td: {}, fg: {}, dstTd: 0, sf: 0 }); };
  try{ out.final = /FINAL/i.test(sm.header.competitions[0].status.type.name); }catch(e){}
  const box = (sm && sm.boxscore) || {};
  (box.players || []).forEach(function(tp){
    const ab = tp.team && tp.team.abbreviation; if(!ab) return;
    const T = team(ab);
    (tp.statistics || []).forEach(function(b){
      const keys = b.keys || [];
      (b.athletes || []).forEach(function(a){
        const nm = a.athlete && a.athlete.displayName; if(!nm) return;
        const key = normName(nm);
        const A = T.ath[key] || (T.ath[key] = { name: nm });
        const st = a.stats || [];
        const g = function(n){ const i = keys.indexOf(n); return i < 0 ? '' : String(st[i] == null ? '' : st[i]); };
        if(b.name === 'passing'){
          A.py = num(g('passingYards')); A.ptdN = num(g('passingTouchdowns')); A.pint = num(g('interceptions'));
          const sk = parseInt(g('sacks-sackYardsLost'), 10) || 0; A.sk = sk; T.sk += sk; T.int += A.pint;
        }else if(b.name === 'rushing'){ A.ry = num(g('rushingYards')); A.rcar = num(g('rushingAttempts')); A.rtdN = num(g('rushingTouchdowns')); }
        else if(b.name === 'receiving'){ A.cy = num(g('receivingYards')); A.rec = num(g('receptions')); A.ctdN = num(g('receivingTouchdowns')); }
        else if(b.name === 'fumbles'){ A.fl = num(g('fumblesLost')); T.fl += A.fl; }
        else if(b.name === 'kicking'){
          A.fgm = parseInt(g('fieldGoalsMade/fieldGoalAttempts').split('/')[0], 10) || 0;
          A.xpm = parseInt(g('extraPointsMade/extraPointAttempts').split('/')[0], 10) || 0;
        }
      });
    });
  });
  (box.teams || []).forEach(function(t){
    const ab = t.team && t.team.abbreviation; if(!ab) return;
    const T = team(ab);
    (t.statistics || []).forEach(function(x){
      if(x.name === 'fumblesLost') T.tfl = Math.max(T.tfl, num(x.displayValue));
      else if(x.name === 'interceptions') T.tint = Math.max(T.tint, num(x.displayValue));
      else if(x.name === 'sacksYardsLost') T.tsk = Math.max(T.tsk, parseInt(x.displayValue, 10) || 0);
    });
  });
  const td = function(T, name){ const k = normName(name); return T.td[k] || (T.td[k] = { rush: [], rec: [], pass: [], two: 0, ret: 0 }); };
  // v1.13.0 (Wes, Nov 15): the real time of each play (ESPN drives → plays[].wallclock), so the TOUCHDOWN pill runs
  // 3 minutes from the actual TD — not from when this phone first noticed it (e.g. after the app sat in the background)
  const wc = {};
  try{ const dv = sm.drives || {}; (dv.previous || []).concat(dv.current ? [dv.current] : []).forEach(function(d){ (d.plays || []).forEach(function(pp){ const t = pp && pp.id && pp.wallclock ? Date.parse(pp.wallclock) : 0; if(t) wc[String(pp.id)] = t; }); }); }catch(e){}
  const mark = function(r, at, lab){ if(at && at >= (r.at || 0)){ r.at = at; r.lab = lab; } };
  (sm.scoringPlays || []).forEach(function(p){
    const ab = p.team && p.team.abbreviation; if(!ab) return;
    const T = team(ab), at = wc[String(p.id)] || 0;
    const type = String((p.type && p.type.text) || ''), x = trim(p.text);
    const sa = String((p.scoringType && p.scoringType.abbreviation) || (p.type && p.type.abbreviation) || '').toUpperCase();
    const sn = String((p.scoringType && p.scoringType.name) || '').toLowerCase();
    let m;
    if(sa === 'FG' || /field goal/i.test(type)){
      if((m = /^(.+?)\s+(\d+)\s*Yds?\s+Field Goal/i.exec(x))){ const k = normName(m[1]); (T.fg[k] || (T.fg[k] = [])).push(+m[2]); }
      return;
    }
    if(sa === 'SF' || sn === 'safety' || /safety/i.test(type)){ T.sf++; return; }
    if(!(sa === 'TD' || sn === 'touchdown' || /touchdown/i.test(type))) return;
    if((m = /^(.+?)\s+(\d+)\s*Yds?\s+pass\s+from\s+(.+?)(?:\s*\(.*)?$/i.exec(x)) && !/return/i.test(type)){
      td(T, m[1]).rec.push(+m[2]); td(T, m[3]).pass.push(+m[2]);
      mark(td(T, m[1]), at, 'TD · ' + m[2] + ' yd catch'); mark(td(T, m[3]), at, 'TD · ' + m[2] + ' yd pass');
    }else if((m = /^(.+?)\s+(\d+)\s*Yds?\s+(?:run|rush)\b/i.exec(x)) && !/return|recovery/i.test(type)){
      td(T, m[1]).rush.push(+m[2]); mark(td(T, m[1]), at, 'TD · ' + m[2] + ' yd run');
    }else if(/return|recovery|blocked|interception|defensive|fumble/i.test(type) || /\b(return|recovery)\b/i.test(x)){
      // v1.1: kick/punt return and fumble recovery TDs are 6 flat to the player too (league rules); D/ST still gets 6
      const rm = /^(.+?)\s+\d+\s*Yds?\s+(?:Kickoff|Punt|Fumble|Blocked|Interception|Missed Field Goal|Kick)?\s*(?:Return|Recovery)/i.exec(x);
      if(rm){ td(T, rm[1]).ret++; mark(td(T, rm[1]), at, 'TD · return'); }
      if(!/\bown\b/i.test(type)){ T.dstTd++; if(at && at >= (T.dstAt || 0)) T.dstAt = at; }
    }
    let tp;
    if((tp = /\(\s*([^()]+?)\s+pass\s+to\s+([^()]+?)\s+for\s+two-?point\s+conversion\s*\)/i.exec(x))){ td(T, tp[1]).two++; td(T, tp[2]).two++; }
    else if((tp = /\(\s*([^()]+?)\s+(?:run|rush)\s+for\s+two-?point\s+conversion\s*\)/i.exec(x))){ td(T, tp[1]).two++; }

function anyLive(){ const sb = curSb(); if(!sb) return false; return Object.keys(sb.events).some(function(k){ return sb.events[k].state === 'in'; }); }

function keyExpired(){

function statusStrip(){
  const c = S.cbs[S.week], sb = S.sb[S.week];
  const live = anyLive(), cur = isCurrentWeek();
  let lead, cls = live ? '' : 'still', parts = [];
  if(!c || !c.data){
    const er = (c && c.err) || (!S.week && S.bootErr);
    if(er) return '<div class="status"><span class="dot bad"></span><span><b class="warn">Can’t load lineups</b> · ' + esc(er === 'cbs_key' ? 'the CBS key has expired' : er) + '</span></div>';
    return '';
  }
  if(!cur) lead = '<b>Week ' + S.week + '</b> · final scores';
  else if(live) lead = '<b>Live</b>';
  else { const nk = nextKick(); lead = nk ? '<b>Next kickoff</b> ' + esc(kickText(nk)) : '<b>Week ' + S.week + ' final</b>'; }
  if(cur){
    parts.push('ESPN stats ' + (sb && sb.at ? ago(sb.okAt || sb.at) : '…'));
    parts.push('CBS lineups ' + ago(c.at));
  }
  let warn = '';
  if(c.err === 'cbs_key') warn = '<b class="warn">CBS key expired</b> · lineups can’t refresh';
  else if(c.err) warn = '<b class="warn">CBS slow</b> · showing lineups from ' + ago(c.at);
  if(sb && sb.err) warn = (warn ? warn + ' · ' : '') + '<b class="warn">Can’t reach ESPN</b>';
  const rs = S.ros[S.week];
  if(num(S.week) >= num(S.curWeek) && rs && rs.err && !rosFor(S.week)) warn = (warn ? warn + ' · ' : '') + '<b class="warn">Lineups may be stale</b> · can’t read this week’s lineup changes yet';
  else if(num(S.week) >= num(S.curWeek) && rs && rs.err && rs.cached && c.err !== 'cbs_key') warn = (warn ? warn + ' · ' : '') + '<b class="warn">Lineups may be stale</b> · last lineup check ' + ago(rs.at);   // v1.7.0: showing the lineups saved on this phone
  if(!warn) return '';

  const over = []; ps.forEach(function(e){ if(e.querySelector('.stp') && e.scrollWidth > e.clientWidth + 1) over.push(e); });

function pv(v, c){ return '<b class="pv ' + (c || '') + '">' + v + '</b>'; }

/* ---------- v1.10.0 (Wes, Nov 12): live-player frame ----------
   A thin outline in the player's position color around his half of the row while his game is on (halftime too), with a soft
   band of light travelling around it ("Sweep"). The frame is the row's first child, so the position square and the arrow
   paint on top of it; its inner edge sits on the center line. Starters: outline + light. Bench: outline only. Open row: none.
   Every light runs on one shared clock (startTime 0), so they all move together and a re-render never makes one jump.
   Right-side frames are mirrored, so in a row where both players are live the two lights meet under the square.
   iPhone "Reduce Motion": outline only. morph() skips these nodes (data-keep); lvFrames() adds/removes/resizes them. */
const LVF = { lap: 6000, base: 0.33, band: 0.45, glow: 0.158, r: 11 };   // v1.21.0 (Wes): 10% brighter
const LVC = { SB: [244,196,61], QB: [157,108,255], RB: [34,211,238], WR: [46,230,128], TE: [255,72,110], K: [255,145,40], DST: [176,190,208] };
let lvRM = false;
try{ const mq = window.matchMedia('(prefers-reduced-motion: reduce)'); lvRM = mq.matches; if(mq.addEventListener) mq.addEventListener('change', function(e){ lvRM = e.matches; lvFrames(true); }); }catch(e){}
function lvMix(a, b, t){ return a.map(function(v, i){ return Math.round(v + (b[i] - v) * t); }); }
function lvRgba(c, a){ return 'rgba(' + c.join(',') + ',' + a + ')'; }
function lvRect(svg, w, h, sw, r){
  const e = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  e.setAttribute('x', sw / 2); e.setAttribute('y', sw / 2); e.setAttribute('width', Math.max(0, w - sw)); e.setAttribute('height', Math.max(0, h - sw));
  e.setAttribute('rx', r || LVF.r); e.setAttribute('fill', 'none'); e.setAttribute('stroke-width', sw);
  svg.appendChild(e); return e;
}
function lvBuild(fr, pos, light, rr){
  rr = rr || LVF.r;   // v1.21.0: corner radius (the Super Bowl card is rounder)
  while(fr.firstChild) fr.removeChild(fr.firstChild);
  const b = fr.getBoundingClientRect(), w = b.width, h = b.height;
  fr.setAttribute('data-wh', Math.round(w) + 'x' + Math.round(h));
  if(w < 24 || h < 24) return;
  const c = LVC[pos] || [61,220,132];
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); svg.setAttribute('aria-hidden', 'true'); fr.appendChild(svg);
  lvRect(svg, w, h, 1, rr).setAttribute('stroke', lvRgba(c, LVF.base));
  if(!light || lvRM || !svg.animate) return;
  const col = lvRgba(lvMix(lvMix(c, [255,255,255], 0.22), [255,255,255], 0.25), LVF.glow);
  const P = 2 * (w - 1 - 2 * (rr - 0.5)) + 2 * (h - 1 - 2 * (rr - 0.5)) + 2 * Math.PI * (rr - 0.5);   // the rect's own perimeter
  for(let k = 1; k <= 8; k++){   // 8 overlapping dashes centered on one point = a band that is brightest in the middle
    const f = LVF.band * k / 8, L = P * f, start = P * (LVF.band - f) / 2, e = lvRect(svg, w, h, 1, rr);
    e.setAttribute('stroke', col); e.setAttribute('stroke-dasharray', L + ' ' + (P - L));
    try{
      const a = e.animate([{ strokeDashoffset: (-start) + 'px' }, { strokeDashoffset: (-start - P) + 'px' }], { duration: LVF.lap, iterations: Infinity, easing: 'linear' });
      a.startTime = 0;
    }catch(x){}
  }
}
function lvFrames(force){
  if(S.view !== 'match') return;
  document.querySelectorAll('#mrows .prow').forEach(function(row){
    const want = {};
    if(row.getAttribute('aria-expanded') !== 'true') row.querySelectorAll(':scope > .pside.lv').forEach(function(sd){ want[sd.classList.contains('r') ? 'r' : 'l'] = sd.getAttribute('data-pos') || ''; });
    row.querySelectorAll(':scope > .lvf').forEach(function(fr){
      const k = fr.getAttribute('data-sd');
      if(force || !(k in want) || fr.getAttribute('data-pos') !== want[k]) fr.parentNode.removeChild(fr);
    });
    const light = !row.classList.contains('bench');
    Object.keys(want).forEach(function(k){
      let fr = row.querySelector(':scope > .lvf-' + k);
      if(!fr){
        fr = document.createElement('span');
        fr.className = 'lvf lvf-' + k; fr.setAttribute('data-keep', ''); fr.setAttribute('data-sd', k); fr.setAttribute('data-pos', want[k]); fr.setAttribute('aria-hidden', 'true');
        row.insertBefore(fr, row.firstChild);
      }
      const b = fr.getBoundingClientRect();
      if(!fr.firstChild || fr.getAttribute('data-wh') !== Math.round(b.width) + 'x' + Math.round(b.height)) lvBuild(fr, want[k], light);
    });
  });
}

/* ---------- v1.10.0 (Wes, Nov 12): tap-open bucket breakdown ----------
   Every scoring bucket is a cell showing the points it pays, with what it takes underneath. Yards: buckets already passed
   (dim green), the bucket he's in (lit = his points), the next one (white outline + a strip filling as yards come in).
   Touchdowns: one group for every TD (same distance table for pass/rush/rec), gold where each landed (×2 = two there).
   Kicker: field goals by distance + XP. D/ST: points-allowed buckets. Other items stay single lines. Cells fade in once. */
const TDB = [[0, 6, '<40'], [40, 8, '40s'], [50, 10, '50s'], [60, 12, '60+']];
const FGB = [[0, 3, '<40'], [40, 4, '40s'], [50, 5, '50+']];

// 5 or 6 = three to a row (rush/rec 3·6·10 / 12·15, pass and D/ST 3 + 3). What each box takes sits right under it.
function bkGroup(g, head, pts, td, cells, cap, kind){

  h += '<div class="bk bkbig c' + n + (kind ? ' ' + kind : '') + '" style="--n:' + cols + '">' + cells.map(function(c, i){
    return '<span class="bcw"><span class="bc' + (c.st ? ' ' + c.st : '') + '" style="--i:' + i + ';--g:' + g + '">' + (c.f != null ? '<i style="width:' + c.f.toFixed(1) + '%"></i>' : '') +
      '<b>' + c.t + (c.n ? '<small>×' + c.n + '</small>' : '') + '</b></span><span class="bcl' + (c.st === 'next' ? ' nx' : /^on/.test(c.st || '') ? ' cu' : '') + '">' + c.th + '</span></span>'; }).join('') + '</div>';
  if(cap) h += '<div class="bn">' + cap + '</div>';
  return h + '</div>';
}
function bkDist(list, B){   // how many TDs / FGs landed in each distance bucket, and their points
  const cnt = B.map(function(){ return 0; }); let pts = 0;
  list.forEach(function(l){ const y = l == null ? 0 : l; let k = 0; B.forEach(function(x, i){ if(y >= x[0]) k = i; }); cnt[k]++; pts += B[k][1]; });
  return { pts: pts, cells: B.map(function(x, i){ return { t: x[1], th: x[2], st: cnt[i] ? 'on' : '', n: cnt[i] > 1 ? cnt[i] : 0 }; }) };
}
function bkYds(a){ return a.map(function(l){ return (l == null ? '?' : l) + ' yd'; }).join(', '); }
function bkCol(p, L){
  const live = L.state === 'in', s = L.s || {};

  L.sc.bars.forEach(function(b){
    const T = b.T; let hi = -1; T.forEach(function(t, i){ if(b.y >= t[0]) hi = i; });
    const nx = hi + 1 < T.length ? hi + 1 : -1, floor = hi >= 0 ? T[hi][0] : 0;
    const cells = T.map(function(t, i){
      const c = { t: t[1], th: t[0], st: i < hi ? 'done' : i === hi ? 'on' : '' };
      if(i === nx){ c.f = clamp((b.y - floor) / (t[0] - floor) * 100, 0, 100); c.st = live ? 'next' : 'part'; }
      return c; });
    const cap = nx < 0 ? '<span>Top bucket</span><em class="mx">MAX</em>' : live ? '<span>' + (T[nx][0] - b.y) + ' more yds</span><span class="tgw">' + TGA + '</span><em>+' + (T[nx][1] - b.v) + '</em>' : '';
    h += bkGroup(g++, b.k + ' <em>' + b.y + ' yds</em>', b.v, false, cells, cap);
  });
  const tds = [].concat(s.ptd || [], s.rtd || [], s.ctd || []);
  if(tds.length){   // v1.10.1 (Wes): "1 yd, 31 yd" (no Pass/Rush label: every TD is scored by its distance); wraps on a big day
    const d = bkDist(tds, TDB);
    h += bkGroup(g++, 'TD' + (tds.length > 1 ? ' <em class="x td">×' + tds.length + '</em>' : ''), d.pts, true, d.cells, '<span class="bl">' + bkYds(tds) + '</span>', 'td');
  }
  if(p.pos === 'K'){
    const fg = s.fg || [], d = bkDist(fg, FGB);
    h += bkGroup(g++, 'FG' + (fg.length > 1 ? ' <em class="x">×' + fg.length + '</em>' : ''), d.pts, false, d.cells, fg.length ? '<span class="bl">' + bkYds(fg) + '</span>' : '<span>None yet</span>');
  }
  if(p.pos === 'DST'){
    const pa = Math.max(0, Math.round((s.dst && s.dst.pa) || 0)); let k = 0; while(pa > PAB[k][0]) k++;
    const cells = PAB.map(function(x, i){ return { t: x[1], th: x[2], st: i < k ? 'gone' : i === k ? 'on' + (x[1] === 0 ? ' zero' : x[1] < 0 ? ' neg' : '') : '' }; });
    const cap = live && k < PAB.length - 1 ? '<span>Drops to ' + (PAB[k + 1][1] > 0 ? '+' : '') + PAB[k + 1][1] + ' at ' + (PAB[k][0] + 1) + ' allowed</span>' : '';
    h += bkGroup(g++, 'ALLOWED <em>' + pa + ' pts</em>', PAB[k][1], false, cells, cap);
  }
  // everything else (INT, fumble lost, 2-pt, return TD, XP, sacks, D/ST INT / fumble rec / TD / safety) stays a single line
  const ln = L.sc.lines.filter(function(l){ return !(l.lab === 'PASS TD' || l.lab === 'RUSH TD' || l.lab === 'REC TD' || l.lab === 'FG' || l.lab === 'PTS ALLOWED'); });
  if(ln.length) h += '<div class="bg ln">' + ln.map(function(l){ return '<div class="bh"><span>' + esc(l.lab) + ' <em>' + esc(l.em) + '</em></span>' + bkChip(l.v, l.cls === 'td') + '</div>'; }).join('') + '</div>';
  if(L.mismatch) h += '<div class="bg ln"><div class="bh"><span class="cbsl">CBS HAS</span>' + pv(p.cbsPts, 'cbs') + '</div><div class="bsrc">Stat correction or rule difference</div></div>';
  h += '<div class="dtot"><span>TOTAL</span>' + pv(L.pts, 'total') + '</div>';
  if(L.cbsFinal) h += '<div class="bsrc">Official CBS points (includes stat corrections)</div>';
  else if(L.src === 'cbs') h += '<div class="bsrc">Stats from CBS</div>';
  h += injBlock(p);   // v1.30.0 (Wes, Nov 23): CBS injury news also during and after his game (e.g. hurt in the 4th quarter)
  return '<div class="dcol bx">' + h + '</div>';
}
function dcol(p, L){

  if(L.state === 'pre' || !L.sc){
    const ep0 = ADV && isCurrentWeek() ? engPlayer(p.id) : null, ep = ep0 && cbsGone(p, L) ? [0, 0, 0] : ep0, r = isCurrentWeek() ? projFor(p) : null, ib = injBlock(p);
    let x = '<div class="grp"><div class="dl"><span>' + (ep ? 'PROJECTED' : 'NOT STARTED') + '</span>' + pv(ep ? ep[0].toFixed(1) : '–', ep ? 'proj' : '') + '</div>' +
      (ep ? '<div class="dsub"><span>Floor ' + Math.round(ep[1]) + ' · Ceiling ' + Math.round(ep[2]) + '</span></div>' : '') + '<div class="dsub"><span>Kicks off ' + esc(L.kick) + '</span></div></div>';
    // v1.11.0 (Wes): CBS's INJURY block when CBS lists him; no "% to play" anywhere
    x += ib;

    if(extra.length) x += '<div class="grp"><div class="dsub"><span class="cbsl">' + esc(extra.join(' · ')) + '</span></div></div>';

  L.sc.bars.forEach(function(b){
    const v = tierPts(b.y, b.T), n = nextTier(b.y, b.T);

      '<div class="tb' + (n ? '' : ' max') + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="dsub"><span>' + (n ? (n.at - b.y) + ' more yds' : 'Top tier') + '</span>' + (n ? '<span class="tgw">' + TGA + '</span><span class="gain">+' + n.gain + '</span>' : '<span class="gain max">MAX</span>') + '</div></div>';

  });

  if(L.cbsFinal) h += '<div class="grp"><div class="dsub"><span>Official CBS points (includes stat corrections)</span></div></div>';
  h += '<div class="dtot"><span>TOTAL</span>' + pv(L.pts, 'total') + '</div>';

/* v1.17.0 (Wes, Nov 17): Matchup "Current | Optimal" toggle under each team (FantasyPros-style, admin only).
   Always starts on Current. Optimal = that team's best healthy lineup by our projections (same rule as the engine's
   playoff odds): players whose game has started stay where CBS has them; Out / IR / bye / no projection never start.
   The rows swap (bench player up, starter down), and the projected totals + win % come from a one-game engine run. */
const OPT = { v: null, res: {}, busy: false, want: null, id: 0 };
function optOn(id){ return !!(OPT.v && OPT.v.ids[id]); }
function optSide(T, L){
  if(!T) return { T: T, L: L, n: 0 };
  const lrows = L ? L.rows : [], lock = function(q){ return q.mode === 'live' || (q.mode === 'final' && !q.bye); };
  const fixed = T.lineup.map(function(p, i){ return p && lock(engState(p, lrows[i])) ? { p: p, L: lrows[i] } : null; });
  const pool = [], rest = [];
  T.lineup.forEach(function(p, i){ if(p && !fixed[i]) pool.push({ p: p, L: lrows[i] }); });
  T.bench.forEach(function(p, k){ if(p && !p.ir) pool.push({ p: p, L: L && L.bench[k] }); });
  pool.forEach(function(x){
    const q = engState(x.p, x.L), r = projFor(x.p);
    if(lock(q) || q.bye || q.out || !r || r.bye || !(r.pp > 0) || !(r.m > 0)) rest.push(x); else { x.m = r.m; x.use = 1; }
  });
  const use = pool.filter(function(x){ return x.use; }).sort(function(a, b){ return b.m - a.m; });
  const out = fixed.slice(), n = Math.max(out.length, SLOTS.length);
  const fit = function(pos){
    for(let i = 0; i < n; i++) if(!out[i] && SLOTS[i] === pos) return i;
    if(pos === 'RB' || pos === 'WR'){ const f = SLOTS.indexOf('FLEX'); if(f >= 0 && !out[f]) return f; }
    return -1; };
  use.forEach(function(x){ const i = fit(x.p.pos); if(i >= 0) out[i] = x; else rest.push(x); });
  const newL = []; for(let i = 0; i < n; i++) newL.push(out[i] || null);
  const bench = [], bL = [], down = rest.map(function(x){ return x.p; });
  T.bench.forEach(function(p, k){ if(p.ir || down.indexOf(p) >= 0){ bench.push(p); bL.push(L && L.bench[k]); } });   // CBS bench order first
  rest.forEach(function(x){ if(T.bench.indexOf(x.p) < 0){ bench.push(x.p); bL.push(x.L); } });                       // then starters moved down
  const moved = newL.filter(function(x, i){ return x && x.p !== T.lineup[i]; }).length;
  let bp = 0; bL.forEach(function(Lb, k){ if(Lb && !bench[k].ir && Lb.pts) bp += Lb.pts; });
  return { T: Object.assign({}, T, { lineup: newL.map(function(x){ return x ? x.p : null; }), bench: bench }),
           L: L ? Object.assign({}, L, { rows: newL.map(function(x){ return x ? x.L : null; }), bench: bL, bpts: Math.round(bp * 10) / 10 }) : L, n: moved };
}
function optTeamMsg(T, L){

           bench: T.bench.filter(function(p){ return !p.ir; }).map(function(p){ const i = T.bench.indexOf(p); return engState(p, L && L.bench[i]); }) };
}
function optSig(key, h, a){ return key + '|' + (optOn(h) ? 1 : 0) + (optOn(a) ? 1 : 0) + '|' + (ENG.res && ENG.res.id || 0); }

function matchList(){ const LM = liveModel(); if(!LM) return null; return { LM: LM, list: orderedMatchups(LM.model).all }; }
function matchView(){

  const played = (la ? la.rows : []).concat(lb ? lb.rows : []).filter(function(L){ return L && (L.state === 'in' || L.state === 'post'); }).length;

// v1.21.0 (Wes, Nov 20): league tables (Standings DRAFT #, Playoff Engine All teams) show the PROJECTED DRAFT ORDER:
// every team ranked by average pick, a unique #1-#12. One team's own view (Home box, drop-down tile, heads-up card)
// keeps that team's most likely picks with their odds.
let dpRankMemo = { src: null, r: {} };
function dpRank(){
  const sc = ENG.res && ENG.res.pp && ENG.res.pp.sc;   // v1.21.4: the draft order of the same most likely finish as Projected seeds
  if(sc && sc.draft && sc.draft.length){ if(dpRankMemo.src === sc) return dpRankMemo.r; const r = {}; sc.draft.forEach(function(id, i){ r[id] = i + 1; }); dpRankMemo = { src: sc, r: r }; return r; }
  const dp = ENG.res && ((ENG.res.pp && ENG.res.pp.dp) || ENG.res.dp); if(!dp) return {};
  if(dpRankMemo.src === dp) return dpRankMemo.r;
  const r = {}; Object.keys(dp).sort(function(a, b){ return (ppEP(dp[a]) - ppEP(dp[b])) || (a < b ? -1 : 1); }).forEach(function(id, i){ r[id] = i + 1; });
  dpRankMemo = { src: dp, r: r }; return r;
}

/* end-of-week shuffle (v1.4.3): first Standings visit after the week is final. Shows last week's order and records,

function runShuffle(){
  const RB = S.recBanner; RB.anim = false;
  const A = stAdjust(true), ban = document.querySelector('#view .recban');
  const rec3 = function(a, b, c){ return a + '-' + b + (c ? '-' + c : ''); };
  const moves = [];
  if(A) document.querySelectorAll('#view .stcard').forEach(function(card){
    const rows = Array.prototype.slice.call(card.querySelectorAll('.strow')), tops = rows.map(function(r){ return r.offsetTop; });
    rows.forEach(function(r, idx){
      const t = A.byId[r.dataset.st], pv = t && t._prev; if(!pv || tops[pv.i] == null) return;
      const wl = r.querySelector('.stwl'), dv = r.querySelector('.stdv'), rk = r.querySelector('.rk'), mv = r.querySelector('.stmv');
      const now = { wl: wl.textContent, dv: dv.textContent, rk: rk.textContent };
      wl.textContent = rec3(pv.w, pv.l, pv.t); dv.textContent = rec3(pv.dw, pv.dl, pv.dt); rk.textContent = String(pv.i + 1);
      if(mv) mv.style.opacity = '0';
      const dy = tops[pv.i] - tops[idx];
      r.style.transition = 'none'; r.style.transform = dy ? 'translateY(' + dy + 'px)' : '';
      moves.push({ r: r, dy: dy, now: now, wl: wl, dv: dv, rk: rk, mv: mv, up: pv.i > idx });
    });
  });
  if(!moves.length){ RB.wait = false; if(ban) ban.classList.remove('later'); return; }
  RB.wait = true;
  holdRender = Date.now() + 9000;                          // no re-render until the fade is done (keeps it smooth)
  const movers = moves.filter(function(m){ return m.dy; });
  // 1) 1.0 s: numbers flip + flash; teams that moved LIFT (rise, grow a touch, shadow, border lit)
  setTimeout(function(){
    moves.forEach(function(m){ [[m.wl, m.now.wl], [m.dv, m.now.dv], [m.rk, m.now.rk]].forEach(function(x){ if(x[0].textContent !== x[1]){ x[0].textContent = x[1]; x[0].classList.add('flip'); } }); });
    if(movers.length) document.querySelectorAll('#view .stcard').forEach(function(c){ if(c.querySelector('.strow') && movers.some(function(m){ return c.contains(m.r); })) c.classList.add('shuf'); });
    movers.forEach(function(m){ m.r.style.zIndex = m.up ? '4' : '3'; m.r.classList.add('lifted');
      m.r.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s'; m.r.style.transform = 'translateY(' + m.dy + 'px) scale(1.03)'; });
  }, 1000);
  // 2) 1.4 s: SLIDE slowly to the new spot
  setTimeout(function(){ movers.forEach(function(m){ m.r.style.transition = 'transform 1.6s cubic-bezier(.45,0,.2,1), box-shadow .35s'; m.r.style.transform = 'scale(1.03)'; }); }, 1400);
  // 3) 3.05 s: DROP back down (shadow off, border stays lit)
  setTimeout(function(){ movers.forEach(function(m){ m.r.style.transition = 'transform .3s ease-out, box-shadow .3s'; m.r.style.transform = ''; m.r.classList.remove('lifted'); m.r.classList.add('dropped'); });
    document.querySelectorAll('#view .stcard.shuf').forEach(function(c){ c.classList.remove('shuf'); }); }, 3050);
  // 4) 3.4 s: border BLINKS twice; MOVE badges pop in top to bottom
  setTimeout(function(){
    movers.forEach(function(m){ m.r.classList.add('blink'); });
    moves.forEach(function(m, k){ if(m.mv) setTimeout(function(){ m.mv.style.opacity = ''; m.mv.classList.add('pop'); }, 80 * k); });
  }, 3400);
  // 5) 4.3 s: border stays slightly lit, then fades over 4 s; banner slides in
  setTimeout(function(){
    movers.forEach(function(m){ m.r.classList.remove('blink'); m.r.classList.add('lit'); });
    RB.wait = false; const b = document.querySelector('#view .recban'); if(b) b.classList.remove('later');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ movers.forEach(function(m){ m.r.classList.add('fade'); }); }); });
  }, 4300);
  // 6) 8.5 s: back to normal
  setTimeout(function(){
    moves.forEach(function(m){ m.r.classList.remove('dropped', 'lit', 'fade'); m.r.style.transition = ''; m.r.style.zIndex = ''; m.r.style.transform = '';
      if(m.mv) m.mv.classList.remove('pop'); [m.wl, m.dv, m.rk].forEach(function(e){ e.classList.remove('flip'); }); });
    holdRender = 0; if(renderQueued) render();
  }, 8500);
}

/* ---------- pin: lift and glide to the top (FLIP) ---------- */
function cardTops(){ const o = {}; document.querySelectorAll('#cards .mc').forEach(function(c){ o[c.dataset.key] = c.getBoundingClientRect().top; }); return o; }
function flipFrom(before, lift){
  const cards = document.querySelectorAll('#cards .mc'); let any = false;
  cards.forEach(function(c){
    const b = before[c.dataset.key]; if(b == null) return;
    const d = b - c.getBoundingClientRect().top; if(Math.abs(d) < 1) return;
    any = true; c.style.transition = 'none'; c.style.transform = 'translateY(' + d + 'px)';
    if(c.dataset.key === lift) c.classList.add('lift');
  });
  if(!any) return;
  holdRender = Date.now() + 650;
  void document.body.offsetWidth;
  requestAnimationFrame(function(){
    cards.forEach(function(c){ if(!c.style.transform) return; c.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)'; c.style.transform = ''; });
    setTimeout(function(){ cards.forEach(function(c){ c.style.transition = ''; c.classList.remove('lift'); }); holdRender = 0; if(renderQueued) render(); }, 620);
  });
}
function togglePin(key){
  const m = weekModel(); if(!m) return;
  const mt = m.matchups.find(function(x){ return x.key === key; }); if(!mt) return;
  const ids = [mt.home && mt.home.id, mt.away && mt.away.id].filter(Boolean);
  const on = ids.some(function(id){ return S.pins.indexOf(id) >= 0; });
  const before = cardTops();
  if(on) S.pins = S.pins.filter(function(id){ return ids.indexOf(id) < 0; });
  else S.pins = ids.concat(S.pins.filter(function(id){ return ids.indexOf(id) < 0; }));
  put('pins', S.pins);
  render();
  flipFrom(before, on ? null : key);
}

/* --- streams (EventSource, Pick'em pattern) --- */
