# Win % spread check for the consensus engine (Nov 11 2026). Branch push only; prints results, never commits.
name: Spread check
on:
  push:
    branches: [calib-spread]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: pip install -r model/requirements.txt
      - run: python model/calib_spread.py --weeks 4-9 --dnp
